                    </div>
                </div>

                ${this.currentExam ? `
                    <div class="mt-6 bg-gradient-to-r from-red-500 to-red-600 rounded-2xl p-6 text-white flex items-center justify-between">
                        <div>
                            <h3 class="font-bold text-lg mb-1">有未完成的考试</h3>
                            <p class="text-red-100 text-sm">上次考试还未交卷，是否继续？</p>
                        </div>
                        <button onclick="app.resumeExam()" class="bg-white text-red-600 px-6 py-2.5 rounded-xl font-bold hover:bg-red-50 transition">继续考试</button>
                    </div>
                ` : ''}
            </div>
        `;
    },

    // ==================== 全真模拟考试 ====================
    confirmStartExam() {
        if (this.currentExam) {
            this.showModal(`
                <div class="text-center">
                    <div class="w-16 h-16 bg-yellow-100 rounded-full flex items-center justify-center mx-auto mb-4">
                        <svg class="w-8 h-8 text-yellow-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-2.5L13.732 4c-.77-.833-1.964-.833-2.732 0L4.082 16.5c-.77.833.192 2.5 1.732 2.5z"></path></svg>
                    </div>
                    <h3 class="text-lg font-bold text-gray-900 mb-2">发现未完成的考试</h3>
                    <p class="text-gray-600 mb-6">继续之前的考试，或重新开始？</p>
                    <div class="flex space-x-3">
                        <button onclick="app.closeModal(); app.resumeExam()" class="flex-1 bg-blue-600 text-white py-2.5 rounded-xl font-medium hover:bg-blue-700 transition">继续考试</button>
                        <button onclick="app.startNewExam()" class="flex-1 bg-gray-200 text-gray-700 py-2.5 rounded-xl font-medium hover:bg-gray-300 transition">重新开始</button>
                    </div>
                </div>
            `);
        } else {
            this.startNewExam();
        }
    },

    startNewExam() {
        this.closeModal();
        this.examAnswers = {};
        this.examMarked = {};
        this.examStartTime = Date.now();
        this.examTimeLeft = 120 * 60; // 120分钟
        this.currentExam = true;
        this.currentQuestionIndex = 0;
        this.saveExamProgress();
        this.showPage('exam');
        this.startTimer();
        this.showToast('考试开始，请认真作答');
    },

    resumeExam() {
        this.showPage('exam');
        this.startTimer();
        this.showToast('已恢复考试进度');
    },

    startTimer() {
        if (this.examTimer) clearInterval(this.examTimer);
        this.updateTimerDisplay();
        this.examTimer = setInterval(() => {
            this.examTimeLeft--;
            this.updateTimerDisplay();
            if (this.examTimeLeft <= 0) {
                this.submitExam(true);
            }
        }, 1000);
    },

    updateTimerDisplay() {
        const h = Math.floor(this.examTimeLeft / 3600).toString().padStart(2, '0');
        const m = Math.floor((this.examTimeLeft % 3600) / 60).toString().padStart(2, '0');
        const s = (this.examTimeLeft % 60).toString().padStart(2, '0');
        const display = document.getElementById('timerDisplay');
        if (display) {
            display.textContent = `${h}:${m}:${s}`;
            if (this.examTimeLeft < 300) display.classList.add('timer-warning');
            else display.classList.remove('timer-warning');
        }
    },

    getExamQuestions() {
        return questionBank.filter(q => ['listening', 'reading', 'translation'].includes(q.type) && q.level === this.currentLevel);
    },

    renderExam() {
        const main = document.getElementById('mainContent');
        const questions = this.getExamQuestions();
        const q = questions[this.currentQuestionIndex];
        if (!q) return;

        const answeredCount = Object.keys(this.examAnswers).length;
        const markedCount = Object.keys(this.examMarked).filter(k => this.examMarked[k]).length;

        main.innerHTML = `
            <div class="flex flex-col lg:flex-row gap-6">
                <!-- 左侧题目区 -->
                <div class="flex-1">
                    <div class="bg-white rounded-2xl exam-shadow overflow-hidden">
                        <!-- 题目头部 -->
                        <div class="bg-gray-50 px-6 py-4 border-b border-gray-100 flex items-center justify-between flex-wrap gap-3">
                            <div class="flex items-center space-x-3">
                                <span class="text-lg font-bold text-gray-900">第 ${this.currentQuestionIndex + 1} 题</span>
                                <span class="question-type-badge ${q.type === 'listening' ? 'listening-badge' : q.type === 'reading' ? 'reading-badge' : 'translation-badge'}">${q.type === 'listening' ? '听力' : q.type === 'reading' ? '阅读' : '翻译'}</span>
                                <span class="text-sm text-gray-500">${q.section}</span>
                            </div>
                            <div class="flex items-center space-x-2">
                                <span class="text-sm text-gray-500">分值: ${q.score} 分</span>
                                <button onclick="app.toggleMark(${q.id})" class="flex items-center space-x-1 px-3 py-1.5 rounded-lg text-sm font-medium transition ${this.examMarked[q.id] ? 'bg-yellow-100 text-yellow-700' : 'bg-gray-100 text-gray-600 hover:bg-gray-200'}">
                                    <svg class="w-4 h-4" fill="${this.examMarked[q.id] ? 'currentColor' : 'none'}" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z"></path></svg>
                                    <span>${this.examMarked[q.id] ? '已标记' : '标记'}</span>
                                </button>
                            </div>
                        </div>

                        <!-- 题目内容 -->
                        <div class="p-6">
                            <div class="exam-content text-gray-800 mb-6 passage-text">${q.question.replace(/\n/g, '<br>')}</div>
                            
                            <!-- 选项 -->
                            <div class="space-y-3">
                                ${q.options.map((opt, idx) => {
                                    const isSelected = this.examAnswers[q.id]?.includes(idx);
                                    return `
                                        <div onclick="app.selectOption(${q.id}, ${idx})" class="flex items-start p-4 rounded-xl border-2 cursor-pointer transition option-hover ${isSelected ? 'option-selected' : 'border-gray-200 option-default'}">
                                            <span class="option-label">${String.fromCharCode(65 + idx)}</span>
                                            <span class="flex-1 text-gray-700">${opt}</span>
                                        </div>
                                    `;
                                }).join('')}
                            </div>
                        </div>

                        <!-- 底部操作 -->
                        <div class="px-6 py-4 bg-gray-50 border-t border-gray-100 flex items-center justify-between">
                            <button onclick="app.prevQuestion()" ${this.currentQuestionIndex === 0 ? 'disabled' : ''} class="flex items-center space-x-1 px-4 py-2 rounded-xl font-medium transition ${this.currentQuestionIndex === 0 ? 'bg-gray-100 text-gray-400 cursor-not-allowed' : 'bg-white text-gray-700 hover:bg-gray-100 border border-gray-200'}">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                                <span>上一题</span>
                            </button>
                            <div class="flex items-center space-x-3">
                                <button onclick="app.confirmSubmitExam()" class="bg-red-600 text-white px-6 py-2 rounded-xl font-medium hover:bg-red-700 transition">交卷</button>
                                <button onclick="app.nextQuestion()" class="flex items-center space-x-1 px-4 py-2 rounded-xl font-medium transition ${this.currentQuestionIndex === questions.length - 1 ? 'bg-gray-100 text-gray-400 cursor-not-allowed' : 'bg-blue-600 text-white hover:bg-blue-700'}" ${this.currentQuestionIndex === questions.length - 1 ? 'disabled' : ''}>
                                    <span>下一题</span>
                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 右侧导航面板 -->
                <div class="lg:w-80">
                    <div class="bg-white rounded-2xl exam-shadow p-5 sticky top-20">
                        <div class="flex items-center justify-between mb-4">
                            <h3 class="font-bold text-gray-900">答题卡</h3>
                            <span class="text-sm text-gray-500">${answeredCount}/${questions.length} 已答</span>
                        </div>
                        
                        <!-- 图例 -->
                        <div class="flex items-center space-x-4 mb-4 text-xs text-gray-600">
                            <div class="flex items-center space-x-1"><div class="w-3 h-3 bg-blue-600 rounded"></div><span>已答</span></div>
                            <div class="flex items-center space-x-1"><div class="w-3 h-3 bg-gray-200 rounded"></div><span>未答</span></div>
                            <div class="flex items-center space-x-1"><div class="w-3 h-3 bg-yellow-500 rounded"></div><span>标记</span></div>
                        </div>

                        <!-- 题号网格 -->
                        <div class="grid grid-cols-5 sm:grid-cols-6 lg:grid-cols-5 gap-2 max-h-96 overflow-y-auto custom-scrollbar">
                            ${questions.map((question, idx) => {
                                const isAnswered = this.examAnswers[question.id] !== undefined;
                                const isMarked = this.examMarked[question.id];
                                const isCurrent = idx === this.currentQuestionIndex;
                                let cls = 'bg-gray-100 text-gray-600 hover:bg-gray-200';
                                if (isMarked) cls = 'nav-marked';
                                else if (isAnswered) cls = 'nav-answered';
                                if (isCurrent) cls += ' nav-current';
                                return `<button onclick="app.goToQuestion(${idx})" class="w-full aspect-square rounded-lg text-sm font-medium transition ${cls}">${idx + 1}</button>`;
                            }).join('')}
                        </div>

                        <div class="mt-4 pt-4 border-t border-gray-100">
                            <div class="flex justify-between text-sm text-gray-600 mb-2">
                                <span>已答: ${answeredCount} 题</span>
                                <span>标记: ${markedCount} 题</span>
                            </div>
                            <div class="w-full bg-gray-200 rounded-full h-2">
                                <div class="bg-blue-600 h-2 rounded-full transition-all" style="width: ${(answeredCount / questions.length * 100).toFixed(0)}%"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        `;
    },

    selectOption(qid, idx) {
        const q = questionBank.find(x => x.id === qid);
        if (!q) return;
        if (!this.examAnswers[qid]) this.examAnswers[qid] = [];
        
        if (q.answer.length > 1) {
            // 多选
            const pos = this.examAnswers[qid].indexOf(idx);
            if (pos > -1) this.examAnswers[qid].splice(pos, 1);
            else this.examAnswers[qid].push(idx);
        } else {
            // 单选
            this.examAnswers[qid] = [idx];
        }
        this.saveExamProgress();
        this.renderExam();
    },

    toggleMark(qid) {
        this.examMarked[qid] = !this.examMarked[qid];
        if (!this.examMarked[qid]) delete this.examMarked[qid];
        this.saveExamProgress();
        this.renderExam();
    },

    prevQuestion() {
        if (this.currentQuestionIndex > 0) {
            this.currentQuestionIndex--;
            this.renderExam();
        }
    },

    nextQuestion() {
        const questions = this.getExamQuestions();
        if (this.currentQuestionIndex < questions.length - 1) {
            this.currentQuestionIndex++;
            this.renderExam();
        }
    },

    goToQuestion(idx) {
        this.currentQuestionIndex = idx;
        this.renderExam();
    },

    confirmSubmitExam() {
        const questions = this.getExamQuestions();
        const unanswered = questions.filter(q => !this.examAnswers[q.id]).length;
        
        this.showModal(`
            <div class="text-center">
                <div class="w-16 h-16 bg-red-100 rounded-full flex items-center justify-center mx-auto mb-4">
                    <svg class="w-8 h-8 text-red-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-2.5L13.732 4c-.77-.833-1.964-.833-2.732 0L4.082 16.5c-.77.833.192 2.5 1.732 2.5z"></path></svg>
                </div>
                <h3 class="text-lg font-bold text-gray-900 mb-2">确认交卷？</h3>
                <p class="text-gray-600 mb-2">还有 <span class="font-bold text-red-600">${unanswered}</span> 道题未作答</p>
                <p class="text-sm text-gray-500 mb-6">交卷后将无法修改答案</p>
                <div class="flex space-x-3">
                    <button onclick="app.closeModal()" class="flex-1 bg-gray-200 text-gray-700 py-2.5 rounded-xl font-medium hover:bg-gray-300 transition">继续答题</button>
                    <button onclick="app.submitExam()" class="flex-1 bg-red-600 text-white py-2.5 rounded-xl font-medium hover:bg-red-700 transition">确认交卷</button>
                </div>
            </div>
        `);
    },

    submitExam(isTimeout = false) {
        if (this.examTimer) clearInterval(this.examTimer);
        this.examTimer = null;
        
        const questions = this.getExamQuestions();
        let totalScore = 0;
        let listeningScore = 0, readingScore = 0, translationScore = 0;
        let correctCount = 0;
        let listeningTotal = 0, readingTotal = 0, translationTotal = 0;

        questions.forEach(q => {
            const userAns = this.examAnswers[q.id] || [];
            const isCorrect = JSON.stringify([...userAns].sort()) === JSON.stringify([...q.answer].sort());
            
            if (q.type === 'listening') listeningTotal += q.score;
            else if (q.type === 'reading') readingTotal += q.score;
            else translationTotal += q.score;

            if (isCorrect) {
                correctCount++;
                totalScore += q.score;
                if (q.type === 'listening') listeningScore += q.score;
                else if (q.type === 'reading') readingScore += q.score;
                else translationScore += q.score;
                this.stats.totalCorrect++;
            }
            this.stats.totalAnswered++;
            
            // 错题入错题本
            if (!isCorrect) {
                const exists = this.wrongQuestions.find(w => w.id === q.id);
                if (!exists) {
                    this.wrongQuestions.push({
                        id: q.id,
                        type: q.type,
                        level: q.level,
                        section: q.section,
                        question: q.question,
                        options: q.options,
                        answer: q.answer,
                        analysis: q.analysis,
                        userAnswer: userAns,
                        timestamp: Date.now(),
                        source: 'exam'
                    });
                }
            }
        });

        const duration = isTimeout ? '120分钟(强制交卷)' : this.formatDuration(120 * 60 - this.examTimeLeft);
        const result = {
            date: new Date().toLocaleString('zh-CN'),
            level: this.currentLevel,
            totalScore: Math.round(totalScore * 10) / 10,
            listeningScore: Math.round(listeningScore * 10) / 10,
            readingScore: Math.round(readingScore * 10) / 10,
            translationScore: Math.round(translationScore * 10) / 10,
            listeningTotal,
            readingTotal,
            translationTotal,
            correctCount,
            totalCount: questions.length,
            accuracy: Math.round((correctCount / questions.length) * 100),
            duration,
            isTimeout
        };

        this.examHistory.push(result);
        this.saveData();
        
        this.currentExam = null;
        this.examAnswers = {};
        this.examMarked = {};
        localStorage.removeItem('cet_exam_progress');
        
        this.closeModal();
        this.showPage('result', { result });
        this.showToast(isTimeout ? '时间到，已自动交卷' : '交卷成功');
    },

    formatDuration(seconds) {
        const h = Math.floor(seconds / 3600);
        const m = Math.floor((seconds % 3600) / 60);
        const s = seconds % 60;
        return h > 0 ? `${h}小时${m}分` : `${m}分${s}秒`;
    },

    // ==================== 成绩报告 ====================
    renderResult(result) {
        if (!result) { this.showPage('dashboard'); return; }
        const main = document.getElementById('mainContent');
        const isPass = result.totalScore >= 425;

        main.innerHTML = `
            <div class="max-w-2xl mx-auto fade-in">
                <div class="bg-white rounded-2xl exam-shadow overflow-hidden">
                    <div class="bg-gradient-to-r ${isPass ? 'from-green-500 to-green-600' : 'from-orange-500 to-red-500'} p-8 text-center text-white">
                        <p class="text-sm opacity-90 mb-2">${result.date}</p>
                        <h2 class="text-2xl font-bold mb-4">${isPass ? '恭喜，成绩合格！' : '继续加油，再接再厉！'}</h2>
                        <div class="text-6xl font-black mb-2">${result.totalScore}</div>
                        <p class="opacity-90">总分 / 710</p>
                    </div>
                    
                    <div class="p-6">
                        <!-- 单项分数 -->
                        <div class="grid grid-cols-3 gap-4 mb-6">
                            <div class="bg-blue-50 rounded-xl p-4 text-center">
                                <p class="text-sm text-blue-600 mb-1">听力</p>
                                <p class="text-2xl font-bold text-blue-700">${result.listeningScore}</p>
                                <p class="text-xs text-blue-400 mt-1">满分 ${result.listeningTotal}</p>
                            </div>
                            <div class="bg-green-50 rounded-xl p-4 text-center">
                                <p class="text-sm text-green-600 mb-1">阅读</p>
                                <p class="text-2xl font-bold text-green-700">${result.readingScore}</p>
                                <p class="text-xs text-green-400 mt-1">满分 ${result.readingTotal}</p>
                            </div>
                            <div class="bg-yellow-50 rounded-xl p-4 text-center">
                                <p class="text-sm text-yellow-600 mb-1">翻译</p>
                                <p class="text-2xl font-bold text-yellow-700">${result.translationScore}</p>
                                <p class="text-xs text-yellow-400 mt-1">满分 ${result.translationTotal}</p>
                            </div>
                        </div>

                        <!-- 统计信息 -->
                        <div class="bg-gray-50 rounded-xl p-5 mb-6">
                            <div class="grid grid-cols-2 gap-4 text-center">
                                <div>
                                    <p class="text-sm text-gray-500">正确率</p>
                                    <p class="text-xl font-bold text-gray-900">${result.accuracy}%</p>
                                    <p class="text-xs text-gray-400">${result.correctCount}/${result.totalCount} 题</p>
                                </div>
                                <div>
                                    <p class="text-sm text-gray-500">用时</p>
                                    <p class="text-xl font-bold text-gray-900">${result.duration}</p>
                                    <p class="text-xs text-gray-400">${result.isTimeout ? '已强制交卷' : '正常交卷'}</p>
                                </div>
                            </div>
                        </div>

                        <!-- 操作按钮 -->
                        <div class="flex space-x-3">
                            <button onclick="app.showPage('dashboard')" class="flex-1 bg-gray-100 text-gray-700 py-3 rounded-xl font-medium hover:bg-gray-200 transition">返回首页</button>
                            <button onclick="app.showPage('wrongbook')" class="flex-1 bg-blue-600 text-white py-3 rounded-xl font-medium hover:bg-blue-700 transition">查看错题</button>
                        </div>
                    </div>
                </div>
            </div>
        `;
    },

    // ==================== 专项刷题 ====================
    startPractice() {
        this.practiceCategory = 'all';
        this.practiceIndex = 0;
        this.practiceAnswers = {};
        this.showAnalysis = false;
        this.showPage('practice');
    },

    getPracticeQuestions() {
        let qs = questionBank.filter(q => q.level === this.currentLevel);
        if (this.practiceCategory === 'all') return qs;
        return qs.filter(q => q.type === this.practiceCategory);
    },

    renderPractice(category) {
        this.practiceCategory = category;
        const main = document.getElementById('mainContent');
        const questions = this.getPracticeQuestions();
        
        if (this.practiceIndex >= questions.length) {
            this.renderPracticeSummary();
            return;
        }

        const q = questions[this.practiceIndex];
        const userAns = this.practiceAnswers[q.id] || [];
        const hasAnswered = userAns.length > 0;
        const isCorrect = hasAnswered && JSON.stringify([...userAns].sort()) === JSON.stringify([...q.answer].sort());

        main.innerHTML = `
            <div class="max-w-3xl mx-auto fade-in">
                <!-- 分类标签 -->
                <div class="flex flex-wrap gap-2 mb-6">
                    ${['all', 'listening', 'reading', 'translation'].map(c => `
                        <button onclick="app.setPracticeCategory('${c}')" class="px-4 py-2 rounded-xl text-sm font-medium transition ${this.practiceCategory === c ? 'bg-blue-600 text-white' : 'bg-white text-gray-600 hover:bg-gray-100'}">
                            ${c === 'all' ? '全部' : c === 'listening' ? '听力' : c === 'reading' ? '阅读' : '翻译'}
                            <span class="ml-1 text-xs opacity-75">(${c === 'all' ? questionBank.filter(x=>x.level===this.currentLevel).length : questionBank.filter(x=>x.type===c && x.level===this.currentLevel).length})</span>
                        </button>
                    `).join('')}
                </div>

                <div class="bg-white rounded-2xl exam-shadow overflow-hidden">
                    <div class="bg-gray-50 px-6 py-4 border-b border-gray-100 flex items-center justify-between flex-wrap gap-3">
                        <div class="flex items-center space-x-3">
                            <span class="text-lg font-bold text-gray-900">第 ${this.practiceIndex + 1} / ${questions.length} 题</span>
                            <span class="question-type-badge ${q.type === 'listening' ? 'listening-badge' : q.type === 'reading' ? 'reading-badge' : 'translation-badge'}">${q.type === 'listening' ? '听力' : q.type === 'reading' ? '阅读' : '翻译'}</span>
                        </div>
                        <span class="text-sm text-gray-500">分值: ${q.score} 分</span>
                    </div>

                    <div class="p-6">
                        <div class="exam-content text-gray-800 mb-6 passage-text">${q.question.replace(/\n/g, '<br>')}</div>
                        
                        <div class="space-y-3 mb-6">
                            ${q.options.map((opt, idx) => {
                                const isSelected = userAns.includes(idx);
                                let cls = 'border-gray-200 option-default';
                                let labelCls = '';
                                if (this.showAnalysis) {
                                    if (q.answer.includes(idx)) { cls = 'option-correct'; labelCls = 'correct-tag'; }
                                    else if (isSelected) { cls = 'option-wrong'; labelCls = 'wrong-tag'; }
                                } else if (isSelected) {
                                    cls = 'option-selected';
                                }
                                return `
                                    <div onclick="app.selectPracticeOption(${q.id}, ${idx})" class="flex items-start p-4 rounded-xl border-2 cursor-pointer transition option-hover ${cls}">
                                        <span class="option-label ${labelCls}">${String.fromCharCode(65 + idx)}</span>
                                        <span class="flex-1 text-gray-700">${opt}</span>
                                        ${this.showAnalysis && q.answer.includes(idx) ? '<svg class="w-5 h-5 text-green-600 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>' : ''}
                                        ${this.showAnalysis && isSelected && !q.answer.includes(idx) ? '<svg class="w-5 h-5 text-red-600 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>' : ''}
                                    </div>
                                `;
                            }).join('')}
                        </div>

                        ${this.showAnalysis ? `
                            <div class="bg-blue-50 rounded-xl p-5 mb-6 border border-blue-100">
                                <div class="flex items-center space-x-2 mb-3">
                                    <svg class="w-5 h-5 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                                    <span class="font-bold text-blue-900">答案解析</span>
                                </div>
                                <p class="text-sm text-blue-800 mb-2">正确答案: <span class="font-bold">${q.answer.map(i => String.fromCharCode(65+i)).join(', ')}</span></p>
                                <p class="text-blue-800 leading-relaxed">${q.analysis}</p>
                            </div>
                        ` : ''}

                        <div class="flex items-center justify-between">
                            <button onclick="app.prevPractice()" ${this.practiceIndex === 0 ? 'disabled' : ''} class="flex items-center space-x-1 px-4 py-2 rounded-xl font-medium transition ${this.practiceIndex === 0 ? 'bg-gray-100 text-gray-400 cursor-not-allowed' : 'bg-white text-gray-700 hover:bg-gray-100 border border-gray-200'}">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                                <span>上一题</span>
                            </button>
                            <div class="flex items-center space-x-3">
                                ${!this.showAnalysis && hasAnswered ? `
                                    <button onclick="app.checkPracticeAnswer()" class="bg-green-600 text-white px-6 py-2 rounded-xl font-medium hover:bg-green-700 transition">查看解析</button>
                                ` : ''}
                                <button onclick="app.nextPractice()" class="flex items-center space-x-1 px-4 py-2 rounded-xl font-medium transition bg-blue-600 text-white hover:bg-blue-700">
                                    <span>${this.practiceIndex === questions.length - 1 ? '完成练习' : '下一题'}</span>
                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        `;
    },

    setPracticeCategory(c) {
        this.practiceCategory = c;
        this.practiceIndex = 0;
        this.practiceAnswers = {};
        this.showAnalysis = false;
        this.renderPractice(c);
    },

    selectPracticeOption(qid, idx) {
        if (this.showAnalysis) return;
        const q = questionBank.find(x => x.id === qid);
        if (!q) return;
        if (!this.practiceAnswers[qid]) this.practiceAnswers[qid] = [];
        
        if (q.answer.length > 1) {
            const pos = this.practiceAnswers[qid].indexOf(idx);
            if (pos > -1) this.practiceAnswers[qid].splice(pos, 1);
            else this.practiceAnswers[qid].push(idx);
        } else {
            this.practiceAnswers[qid] = [idx];
        }
        this.renderPractice(this.practiceCategory);
    },

    checkPracticeAnswer() {
        this.showAnalysis = true;
        const q = this.getPracticeQuestions()[this.practiceIndex];
        const userAns = this.practiceAnswers[q.id] || [];
        const isCorrect = JSON.stringify([...userAns].sort()) === JSON.stringify([...q.answer].sort());
        
        this.stats.totalAnswered++;
        if (isCorrect) this.stats.totalCorrect++;
        else {
            const exists = this.wrongQuestions.find(w => w.id === q.id);
            if (!exists) {
                this.wrongQuestions.push({
                    id: q.id, type: q.type, level: q.level, section: q.section, question: q.question,
                    options: q.options, answer: q.answer, analysis: q.analysis,
                    userAnswer: userAns, timestamp: Date.now(), source: 'practice'
                });
            }
        }
        this.saveData();
        this.renderPractice(this.practiceCategory);
    },

    prevPractice() {
        if (this.practiceIndex > 0) {
            this.practiceIndex--;
            this.showAnalysis = false;
            this.renderPractice(this.practiceCategory);
        }
    },

    nextPractice() {
        this.practiceIndex++;
        this.showAnalysis = false;
        this.renderPractice(this.practiceCategory);
    },

    renderPracticeSummary() {
        const main = document.getElementById('mainContent');
        const questions = this.getPracticeQuestions();
        let correct = 0;
        questions.forEach(q => {
            const userAns = this.practiceAnswers[q.id] || [];
            if (JSON.stringify([...userAns].sort()) === JSON.stringify([...q.answer].sort())) correct++;
        });

        main.innerHTML = `
            <div class="max-w-md mx-auto fade-in">
                <div class="bg-white rounded-2xl exam-shadow p-8 text-center">
                    <div class="w-20 h-20 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-4">
                        <svg class="w-10 h-10 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    </div>
                    <h2 class="text-2xl font-bold text-gray-900 mb-2">练习完成</h2>
                    <p class="text-gray-600 mb-6">本轮共 ${questions.length} 题，答对 ${correct} 题</p>
                    <div class="bg-gray-50 rounded-xl p-4 mb-6">
                        <div class="text-3xl font-bold text-blue-600">${Math.round(correct / questions.length * 100)}%</div>
                        <div class="text-sm text-gray-500">正确率</div>
                    </div>
                    <div class="flex space-x-3">
                        <button onclick="app.startPractice()" class="flex-1 bg-gray-100 text-gray-700 py-3 rounded-xl font-medium hover:bg-gray-200 transition">再练一次</button>
                        <button onclick="app.showPage('dashboard')" class="flex-1 bg-blue-600 text-white py-3 rounded-xl font-medium hover:bg-blue-700 transition">返回首页</button>
                    </div>
                </div>
            </div>
        `;
    },

    // ==================== 错题本 ====================
    renderWrongBook() {
        const main = document.getElementById('mainContent');
        const wrongs = this.wrongQuestions.filter(w => w.level === this.currentLevel);

        main.innerHTML = `
            <div class="fade-in">
                <div class="flex items-center justify-between mb-6 flex-wrap gap-3">
                    <div>
                        <h2 class="text-2xl font-bold text-gray-900">错题本</h2>
                        <p class="text-gray-500 text-sm mt-1">大学英语${this.currentLevel === 'cet4' ? '四级' : '六级'} · 共 ${wrongs.length} 道错题</p>
                    </div>
                    ${wrongs.length > 0 ? `
                        <button onclick="app.confirmClearWrong()" class="bg-red-100 text-red-600 px-4 py-2 rounded-xl text-sm font-medium hover:bg-red-200 transition">一键清空</button>
                    ` : ''}
                </div>

                ${wrongs.length === 0 ? `
                    <div class="bg-white rounded-2xl exam-shadow p-12 text-center">
                        <svg class="w-16 h-16 mx-auto mb-4 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                        <h3 class="text-lg font-bold text-gray-900 mb-2">暂无错题</h3>
                        <p class="text-gray-500 mb-6">刷题或模考中答错的题目会自动存入错题本</p>
                        <button onclick="app.startPractice()" class="bg-blue-600 text-white px-6 py-2.5 rounded-xl font-medium hover:bg-blue-700 transition">去刷题</button>
                    </div>
                ` : `
                    <div class="space-y-4">
                        ${wrongs.map((w, idx) => `
                            <div class="bg-white rounded-2xl exam-shadow p-5 slide-up" style="animation-delay: ${idx * 0.05}s">
                                <div class="flex items-start justify-between mb-3">
                                    <div class="flex items-center space-x-2 flex-wrap gap-2">
                                        <span class="question-type-badge ${w.type === 'listening' ? 'listening-badge' : w.type === 'reading' ? 'reading-badge' : 'translation-badge'}">${w.type === 'listening' ? '听力' : w.type === 'reading' ? '阅读' : '翻译'}</span>
                                        <span class="text-xs text-gray-400">${w.source === 'exam' ? '模考' : '刷题'} · ${new Date(w.timestamp).toLocaleDateString()}</span>
                                    </div>
                                    <div class="flex items-center space-x-2">
                                        <button onclick="app.redoWrong(${w.id})" class="text-blue-600 text-sm font-medium hover:underline">重做</button>
                                        <button onclick="app.removeWrong(${w.id})" class="text-red-500 text-sm font-medium hover:underline">移除</button>
                                    </div>
                                </div>
                                <div class="text-gray-800 text-sm mb-3 passage-text">${w.question.substring(0, 200).replace(/\n/g, '<br>')}${w.question.length > 200 ? '...' : ''}</div>
                                <div class="flex flex-wrap gap-2 text-sm">
                                    <span class="px-3 py-1 bg-red-50 text-red-600 rounded-lg">你的答案: ${w.userAnswer.length ? w.userAnswer.map(i => String.fromCharCode(65+i)).join(', ') : '未作答'}</span>
                                    <span class="px-3 py-1 bg-green-50 text-green-600 rounded-lg">正确答案: ${w.answer.map(i => String.fromCharCode(65+i)).join(', ')}</span>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                `}
            </div>
        `;
    },

    redoWrong(id) {
        const w = this.wrongQuestions.find(x => x.id === id);
        if (!w) return;
        
        this.showModal(`
            <div class="text-left">
                <div class="flex items-center justify-between mb-4">
                    <h3 class="font-bold text-gray-900">错题重做</h3>
                    <button onclick="app.closeModal()" class="text-gray-400 hover:text-gray-600"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg></button>
                </div>
                <div class="text-gray-800 text-sm mb-4 passage-text max-h-48 overflow-y-auto custom-scrollbar">${w.question.replace(/\n/g, '<br>')}</div>
                <div class="space-y-2 mb-4">
                    ${w.options.map((opt, idx) => `
                        <label class="flex items-start p-3 rounded-lg border-2 border-gray-200 cursor-pointer hover:border-blue-400 transition">
                            <input type="${w.answer.length > 1 ? 'checkbox' : 'radio'}" name="redo_${id}" value="${idx}" class="mt-1 mr-2">
                            <span class="text-sm text-gray-700">${String.fromCharCode(65+idx)}. ${opt}</span>
                        </label>
                    `).join('')}
                </div>
                <div id="redoResult" class="hidden mb-4"></div>
                <div class="flex space-x-3">
                    <button onclick="app.closeModal()" class="flex-1 bg-gray-100 text-gray-700 py-2.5 rounded-xl font-medium hover:bg-gray-200 transition">取消</button>
                    <button onclick="app.checkRedo(${id})" class="flex-1 bg-blue-600 text-white py-2.5 rounded-xl font-medium hover:bg-blue-700 transition">提交</button>
                </div>
            </div>
        `);
    },

    checkRedo(id) {
        const w = this.wrongQuestions.find(x => x.id === id);
        if (!w) return;
        const inputs = document.querySelectorAll(`input[name="redo_${id}"]:checked`);
        const userAns = Array.from(inputs).map(i => parseInt(i.value));
        const isCorrect = JSON.stringify([...userAns].sort()) === JSON.stringify([...w.answer].sort());
        
        const resultDiv = document.getElementById('redoResult');
        resultDiv.classList.remove('hidden');
        resultDiv.innerHTML = `
            <div class="${isCorrect ? 'bg-green-50 border-green-200' : 'bg-red-50 border-red-200'} border rounded-xl p-4">
                <p class="font-bold ${isCorrect ? 'text-green-700' : 'text-red-700'} mb-2">${isCorrect ? '回答正确！' : '回答错误'}</p>
                <p class="text-sm text-gray-700 mb-2">正确答案: ${w.answer.map(i => String.fromCharCode(65+i)).join(', ')}</p>
                <p class="text-sm text-gray-600">${w.analysis}</p>
            </div>
            ${isCorrect ? `<button onclick="app.removeWrong(${id}); app.closeModal();" class="w-full mt-3 bg-green-600 text-white py-2 rounded-xl font-medium hover:bg-green-700 transition">移出错题本</button>` : ''}
        `;
        
        if (isCorrect) {
            this.stats.totalCorrect++;
            this.stats.totalAnswered++;
            this.saveData();
        }
    },

    removeWrong(id) {
        this.wrongQuestions = this.wrongQuestions.filter(w => w.id !== id);
        this.saveData();
        this.showToast('已移除');
        this.renderWrongBook();
    },

    confirmClearWrong() {
        this.showModal(`
            <div class="text-center">
                <div class="w-16 h-16 bg-red-100 rounded-full flex items-center justify-center mx-auto mb-4">
                    <svg class="w-8 h-8 text-red-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                </div>
                <h3 class="text-lg font-bold text-gray-900 mb-2">确认清空错题本？</h3>
                <p class="text-gray-600 mb-6">共 ${this.wrongQuestions.length} 道错题将被删除，此操作不可恢复</p>
                <div class="flex space-x-3">
                    <button onclick="app.closeModal()" class="flex-1 bg-gray-200 text-gray-700 py-2.5 rounded-xl font-medium hover:bg-gray-300 transition">取消</button>
                    <button onclick="app.clearWrongBook()" class="flex-1 bg-red-600 text-white py-2.5 rounded-xl font-medium hover:bg-red-700 transition">确认清空</button>
                </div>
            </div>
        `);
    },

    clearWrongBook() {
        this.wrongQuestions = [];
        this.saveData();
        this.closeModal();
        this.showToast('错题本已清空');
        this.renderWrongBook();
    },

    // ==================== 历史成绩 ====================
    renderHistory() {
        const main = document.getElementById('mainContent');
        const history = [...this.examHistory].reverse().filter(h => h.level === this.currentLevel);

        main.innerHTML = `
            <div class="fade-in">
                <div class="mb-6">
                    <h2 class="text-2xl font-bold text-gray-900">历史成绩</h2>
                    <p class="text-gray-500 text-sm mt-1">大学英语${this.currentLevel === 'cet4' ? '四级' : '六级'}历次模考分数变化趋势</p>
                </div>

                ${history.length === 0 ? `
                    <div class="bg-white rounded-2xl exam-shadow p-12 text-center">
                        <svg class="w-16 h-16 mx-auto mb-4 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path></svg>
                        <h3 class="text-lg font-bold text-gray-900 mb-2">暂无成绩记录</h3>
                        <p class="text-gray-500 mb-6">完成一次全真模拟考试后，成绩将显示在这里</p>
                        <button onclick="app.confirmStartExam()" class="bg-blue-600 text-white px-6 py-2.5 rounded-xl font-medium hover:bg-blue-700 transition">开始模考</button>
                    </div>
                ` : `
                    <!-- 趋势图 -->
                    <div class="bg-white rounded-2xl exam-shadow p-6 mb-6">
                        <h3 class="font-bold text-gray-900 mb-4">分数趋势</h3>
                        <div class="flex items-end space-x-2 h-40 overflow-x-auto pb-2 custom-scrollbar">
                            ${history.map((h, i) => {
                                const height = Math.max((h.totalScore / 710) * 100, 8);
                                return `
                                    <div class="flex flex-col items-center flex-shrink-0" style="min-width: 50px">
                                        <span class="text-xs font-bold ${h.totalScore >= 425 ? 'text-green-600' : 'text-orange-500'} mb-1">${h.totalScore}</span>
                                        <div class="w-8 rounded-t-lg chart-bar ${h.totalScore >= 425 ? 'bg-green-500' : 'bg-orange-400'}" style="height: ${height}%"></div>
                                        <span class="text-xs text-gray-400 mt-2 transform -rotate-45 origin-top-left whitespace-nowrap">${h.date.split(' ')[0].slice(5)}</span>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    </div>

                    <!-- 详细列表 -->
                    <div class="space-y-4">
                        ${history.map((h, i) => `
                            <div class="bg-white rounded-2xl exam-shadow p-5 slide-up" style="animation-delay: ${i * 0.05}s">
                                <div class="flex items-center justify-between mb-4">
                                    <div>
                                        <p class="font-bold text-gray-900">${h.date}</p>
                                        <p class="text-sm text-gray-500">用时 ${h.duration} · 正确率 ${h.accuracy}%</p>
                                    </div>
                                    <div class="text-right">
                                        <p class="text-3xl font-bold ${h.totalScore >= 425 ? 'text-green-600' : 'text-orange-500'}">${h.totalScore}</p>
                                        <p class="text-xs text-gray-400">${h.totalScore >= 425 ? '合格' : '未合格'}</p>
                                    </div>
                                </div>
                                <div class="grid grid-cols-3 gap-3">
                                    <div class="bg-blue-50 rounded-xl p-3 text-center">
                                        <p class="text-xs text-blue-600 mb-1">听力</p>
                                        <p class="font-bold text-blue-700">${h.listeningScore}</p>
                                    </div>
                                    <div class="bg-green-50 rounded-xl p-3 text-center">
                                        <p class="text-xs text-green-600 mb-1">阅读</p>
                                        <p class="font-bold text-green-700">${h.readingScore}</p>
                                    </div>
                                    <div class="bg-yellow-50 rounded-xl p-3 text-center">
                                        <p class="text-xs text-yellow-600 mb-1">翻译</p>
                                        <p class="font-bold text-yellow-700">${h.translationScore}</p>
                                    </div>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                `}
            </div>
        `;
    }
};

// 初始化
app.init();
</script>
</body>
</html>
