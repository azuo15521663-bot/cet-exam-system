<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>大学英语四六级全真模考系统</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <style>
        * { font-family: 'Noto Sans SC', sans-serif; -webkit-tap-highlight-color: transparent; }
        .exam-shadow { box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        .option-hover:hover { background-color: #f0f7ff; border-color: #3b82f6; }
        .option-selected { background-color: #eff6ff; border-color: #3b82f6; }
        .option-correct { background-color: #f0fdf4; border-color: #22c55e; }
        .option-wrong { background-color: #fef2f2; border-color: #ef4444; }
        .nav-answered { background-color: #3b82f6; color: white; }
        .nav-marked { background-color: #f59e0b; color: white; }
        .nav-current { border: 2px solid #1d4ed8; font-weight: bold; }
        .timer-warning { color: #ef4444; animation: pulse 1s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        .fade-in { animation: fadeIn 0.3s ease-in; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .slide-up { animation: slideUp 0.3s ease-out; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f1f1; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #c1c1c1; border-radius: 3px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #a8a8a8; }
        .question-type-badge { font-size: 0.7rem; padding: 2px 8px; border-radius: 4px; }
        .listening-badge { background: #dbeafe; color: #1d4ed8; }
        .reading-badge { background: #dcfce7; color: #166534; }
        .translation-badge { background: #fef3c7; color: #92400e; }
        .writing-badge { background: #f3e8ff; color: #7c3aed; }
        .stat-card { transition: transform 0.2s, box-shadow 0.2s; }
        .stat-card:hover { transform: translateY(-2px); box-shadow: 0 6px 25px rgba(0,0,0,0.1); }
        .btn-primary { transition: all 0.2s; }
        .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4); }
        .btn-primary:active { transform: translateY(0); }
        .modal-overlay { background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); }
        .chart-bar { transition: width 0.8s ease-out; }
        .wrong-tag { background: #fee2e2; color: #991b1b; }
        .correct-tag { background: #dcfce7; color: #166534; }
        .mark-tag { background: #fef3c7; color: #92400e; }
        input[type="checkbox"], input[type="radio"] { accent-color: #3b82f6; }
        .exam-content p { margin-bottom: 0.75rem; line-height: 1.7; }
        .passage-text { line-height: 1.8; text-align: justify; }
        .option-label { min-width: 24px; height: 24px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 0.85rem; font-weight: 600; margin-right: 8px; }
        .option-default .option-label { background: #e5e7eb; color: #374151; }
        .option-selected .option-label { background: #3b82f6; color: white; }
        .option-correct .option-label { background: #22c55e; color: white; }
        .option-wrong .option-label { background: #ef4444; color: white; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen">
    <!-- 顶部导航栏 -->
    <nav id="topNav" class="bg-white shadow-sm sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-14">
                <div class="flex items-center space-x-3">
                    <div class="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center">
                        <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path>
                        </svg>
                    </div>
                    <span class="font-bold text-gray-800 text-lg hidden sm:block">CET 全真模考系统</span>
                    <span class="font-bold text-gray-800 text-sm sm:hidden">CET 模考</span>
                    <div class="flex items-center bg-gray-100 rounded-full p-0.5 ml-3">
                        <button onclick="app.switchLevel('cet4')" id="btnCet4" class="px-3 py-1 rounded-full text-xs font-medium transition ${app.currentLevel==='cet4'?'bg-blue-600 text-white':'text-gray-600 hover:text-gray-900'}">四级</button>
                        <button onclick="app.switchLevel('cet6')" id="btnCet6" class="px-3 py-1 rounded-full text-xs font-medium transition ${app.currentLevel==='cet6'?'bg-purple-600 text-white':'text-gray-600 hover:text-gray-900'}">六级</button>
                    </div>
                </div>
                <div id="navTimer" class="hidden items-center space-x-2 bg-gray-900 text-white px-4 py-1.5 rounded-full">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                    </svg>
                    <span id="timerDisplay" class="font-mono font-bold text-lg">00:00:00</span>
                </div>
                <div class="flex items-center space-x-2">
                    <button onclick="app.showPage('dashboard')" id="navHomeBtn" class="text-gray-600 hover:text-blue-600 px-3 py-2 rounded-md text-sm font-medium transition">首页</button>
                </div>
            </div>
        </div>
    </nav>

    <!-- 主内容区 -->
    <main id="mainContent" class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
        <!-- 页面内容动态渲染 -->
    </main>

    <!-- 模态框 -->
    <div id="modal" class="fixed inset-0 z-[100] hidden items-center justify-center modal-overlay p-4">
        <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full p-6 slide-up">
            <div id="modalContent"></div>
        </div>
    </div>

    <!-- 提示框 -->
    <div id="toast" class="fixed top-20 left-1/2 transform -translate-x-1/2 z-[110] hidden">
        <div class="bg-gray-900 text-white px-6 py-3 rounded-xl shadow-lg flex items-center space-x-2 slide-up">
            <svg class="w-5 h-5 text-green-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
            </svg>
            <span id="toastText">操作成功</span>
        </div>
    </div>

<script>
// ==================== 题库数据 (45题) ====================
const questionBank = [
    // 听力部分 (15题) - 四级
    { id: 1, type: 'listening', level: 'cet4', section: 'Section A', question: 'W: I\'m looking for a textbook for my psychology course. It\'s called "Introduction to Behavioral Psychology". Do you have it in stock?\nM: Let me check... Yes, we have one copy left. It\'s on the second floor in the social sciences section.\nQ: Where is the woman most likely to find the textbook?', options: ['In the psychology department', 'On the second floor of the store', 'In the behavioral sciences section', 'On the first floor near the entrance'], answer: [1], analysis: '对话中男士明确提到教科书在二楼社会科学区域（the second floor in the social sciences section），因此选B。A选项心理系未提及；C选项行为科学区域说法错误；D选项一楼入口附近与原文相反。', score: 7.1 },
    { id: 2, type: 'listening', level: 'cet4', section: 'Section A', question: 'M: Could you tell me how to get to the nearest subway station?\nW: Go straight down this street for two blocks, then turn left at the traffic lights. You\'ll see it right in front of you.\nQ: What should the man do at the traffic lights?', options: ['Turn right', 'Turn left', 'Go straight', 'Turn around'], answer: [1], analysis: '女士指路时说"turn left at the traffic lights"（在红绿灯处左转），因此选B。', score: 7.1 },
    { id: 3, type: 'listening', level: 'cet4', section: 'Section A', question: 'W: The lecture on environmental protection has been moved from Room 301 to the main auditorium.\nM: That\'s great! The auditorium has better acoustics and more seats.\nQ: What does the man think of the change?', options: ['He is disappointed', 'He is indifferent', 'He approves of it', 'He is surprised'], answer: [2], analysis: '男士说"That\'s great!"表示赞同，并解释了优点（更好的音响效果和更多座位），因此选C（赞成）。', score: 7.1 },
    { id: 4, type: 'listening', level: 'cet4', section: 'Section A', question: 'M: The research paper is due next Friday. Have you started working on it yet?\nW: I\'ve finished the outline and collected most of the references, but I haven\'t written the first draft.\nQ: What has the woman completed so far?', options: ['The first draft', 'The outline and references', 'The final version', 'The presentation'], answer: [1], analysis: '女士说完成了大纲（outline）并收集了大部分参考文献（references），但还没写初稿，因此选B。', score: 7.1 },
    { id: 5, type: 'listening', level: 'cet4', section: 'Section A', question: 'W: I heard you got a promotion at work. Congratulations!\nM: Thanks, but it means I\'ll have to relocate to the branch office in Chicago next month.\nQ: What will the man do next month?', options: ['Start a new job', 'Move to Chicago', 'Take a vacation', 'Visit a branch office'], answer: [1], analysis: '男士说"relocate to the branch office in Chicago"（搬到芝加哥分公司），relocate意为搬迁、调动，因此选B。', score: 7.1 },
    { id: 6, type: 'listening', level: 'cet4', section: 'Section B', question: 'M: Our flight has been delayed due to heavy fog. The new departure time is 3:45 PM.\nW: That means we\'ll miss our connecting flight in Denver. We\'d better speak to the agent about rebooking.\nQ: What is the cause of the flight delay?', options: ['Technical problems', 'Bad weather', 'Air traffic control', 'Crew shortage'], answer: [1], analysis: '男士明确说延误原因是"heavy fog"（大雾），属于天气原因，因此选B。', score: 7.1 },
    { id: 7, type: 'listening', level: 'cet4', section: 'Section B', question: 'W: Professor Smith, I\'m having trouble understanding the statistical analysis section of my thesis.\nM: Why don\'t you make an appointment with the teaching assistant? He specializes in quantitative methods.\nQ: What does the professor suggest the woman do?', options: ['Rewrite the thesis', 'Consult the teaching assistant', 'Take a statistics course', 'Change her topic'], answer: [1], analysis: '教授建议"make an appointment with the teaching assistant"（预约助教），因为助教擅长定量方法，因此选B。', score: 7.1 },
    { id: 8, type: 'listening', level: 'cet4', section: 'Section B', question: 'M: The new employee orientation will be held on Monday morning instead of Tuesday afternoon.\nW: Will the HR department notify everyone about the schedule change?\nQ: What does the woman want to know?', options: ['When the orientation starts', 'Where the orientation is held', 'If people will be informed of the change', 'Who will attend the orientation'], answer: [2], analysis: '女士问的是HR部门是否会通知所有人时间变更，即她想知道大家是否会被告知，因此选C。', score: 7.1 },
    { id: 9, type: 'listening', level: 'cet4', section: 'Section B', question: 'W: I\'ve been trying to reach the customer service department all morning, but the line is always busy.\nM: You might want to try their online chat support. It\'s usually much faster.\nQ: What does the man recommend?', options: ['Calling back later', 'Sending an email', 'Using online chat support', 'Visiting the office in person'], answer: [2], analysis: '男士建议尝试"online chat support"（在线聊天支持），因此选C。', score: 7.1 },
    { id: 10, type: 'listening', level: 'cet4', section: 'Section B', question: 'M: The museum is offering a special exhibition on ancient Egyptian artifacts this month.\nW: Really? I\'ve always been fascinated by ancient civilizations. Let\'s go this weekend.\nQ: What does the woman want to do this weekend?', options: ['Study ancient history', 'Visit the museum exhibition', 'Travel to Egypt', 'Buy artifacts'], answer: [1], analysis: '女士提议"Let\'s go this weekend"，指的是去参观博物馆的古埃及文物特展，因此选B。', score: 7.1 },
    { id: 11, type: 'listening', level: 'cet4', section: 'Section C', question: 'Passage: Online education has transformed the way people learn. With the advent of high-speed internet and mobile devices, students can now access courses from anywhere in the world. However, this convenience comes with challenges. Many students struggle with self-discipline when studying remotely. Without the structure of a traditional classroom, procrastination becomes a significant obstacle.\nQ: What is the main challenge of online education mentioned in the passage?', options: ['Lack of internet access', 'High tuition costs', 'Self-discipline issues', 'Limited course options'], answer: [2], analysis: '短文明确提到"Many students struggle with self-discipline"（许多学生难以自律），这是在线教育的主要挑战，因此选C。', score: 7.1 },
    { id: 12, type: 'listening', level: 'cet4', section: 'Section C', question: 'Passage: The city council has approved a new plan to build more bike lanes throughout the downtown area. The project aims to reduce traffic congestion and promote environmentally friendly transportation. Construction will begin next spring and is expected to be completed within two years. Local businesses have expressed mixed reactions to the plan.\nQ: What is the purpose of building more bike lanes?', options: ['To create construction jobs', 'To reduce traffic and promote green transport', 'To increase parking spaces', 'To attract more tourists'], answer: [1], analysis: '短文提到项目目的是"reduce traffic congestion and promote environmentally friendly transportation"（减少交通拥堵并促进环保交通），因此选B。', score: 7.1 },
    { id: 13, type: 'listening', level: 'cet4', section: 'Section C', question: 'Passage: A recent study suggests that taking short breaks during work can significantly improve productivity. Researchers found that employees who took a five-minute break every hour were more focused and produced higher quality work than those who worked continuously. The study recommends that companies encourage regular breaks to boost overall performance.\nQ: According to the study, what should companies do?', options: ['Extend working hours', 'Encourage regular breaks', 'Hire more employees', 'Reduce workload'], answer: [1], analysis: '短文最后建议"companies encourage regular breaks"（公司应鼓励定期休息），因此选B。', score: 7.1 },
    { id: 14, type: 'listening', level: 'cet4', section: 'Section C', question: 'Passage: Climate change is affecting agricultural production worldwide. Rising temperatures and unpredictable rainfall patterns have made it difficult for farmers to plan their crops. Some regions are experiencing longer droughts, while others face increased flooding. Scientists are developing new crop varieties that can withstand these extreme weather conditions.\nQ: What are scientists doing to address the agricultural challenges?', options: ['Building irrigation systems', 'Developing weather-resistant crops', 'Predicting rainfall patterns', 'Relocating farms to cities'], answer: [1], analysis: '短文提到科学家正在"developing new crop varieties that can withstand extreme weather conditions"（开发能抵御极端天气的新作物品种），即选B。', score: 7.1 },
    { id: 15, type: 'listening', level: 'cet4', section: 'Section C', question: 'Passage: The university library will extend its opening hours during the final exam period. Starting next week, the library will open at 7 AM and close at midnight, seven days a week. Additional study rooms will also be available on the third floor. Students are encouraged to reserve study rooms in advance through the library website.\nQ: How should students secure a study room?', options: ['Arrive early to queue', 'Reserve online in advance', 'Ask the librarian for help', 'Use student ID to access'], answer: [1], analysis: '短文最后说"reserve study rooms in advance through the library website"（通过图书馆网站提前预约自习室），因此选B。', score: 7.1 },

    // 阅读部分 (20题)
    { id: 16, type: 'reading', level: 'cet4', section: '选词填空', question: 'The rapid development of artificial intelligence has _______ numerous ethical concerns among scientists and policymakers.', options: ['raised', 'risen', 'aroused', 'arisen'], answer: [0], analysis: 'raised concerns是固定搭配，意为"引发担忧"。rise（上升）和arise（出现）是不及物动词，不能接宾语；arouse通常搭配interest/suspicion等，但raise concerns更常用。', score: 3.55 },
    { id: 17, type: 'reading', level: 'cet4', section: '选词填空', question: 'The government has implemented a series of policies to _______ economic growth in the region.', options: ['stimulate', 'simulate', 'accumulate', 'formulate'], answer: [0], analysis: 'stimulate economic growth意为"刺激经济增长"。simulate（模拟）、accumulate（积累）、formulate（制定）均不符合语境。', score: 3.55 },
    { id: 18, type: 'reading', level: 'cet4', section: '选词填空', question: 'Her argument was so _______ that even her opponents had to admit she made a valid point.', options: ['compelling', 'compulsory', 'competitive', 'comprehensive'], answer: [0], analysis: 'compelling意为"有说服力的"。compulsory（强制的）、competitive（竞争的）、comprehensive（全面的）均不符合句意。', score: 3.55 },
    { id: 19, type: 'reading', level: 'cet4', section: '选词填空', question: 'The company decided to _______ its outdated equipment with the latest technology.', options: ['replace', 'displace', 'misplace', 'place'], answer: [0], analysis: 'replace...with...意为"用...替换..."。displace（取代，常指被迫离开）、misplace（放错地方）不符合。', score: 3.55 },
    { id: 20, type: 'reading', level: 'cet4', section: '选词填空', question: 'The research findings were _______ in a prestigious scientific journal last month.', options: ['published', 'publicized', 'printed', 'announced'], answer: [0], analysis: 'publish findings意为"发表研究成果"，是学术规范用语。publicize（宣传）强调广告效应；print（印刷）范围太窄；announce（宣布）不够正式。', score: 3.55 },
    { id: 21, type: 'reading', level: 'cet4', section: '长篇阅读', question: 'Passage: The concept of "emotional intelligence" (EI) was first introduced by psychologists Peter Salovey and John Mayer in 1990. It refers to the ability to perceive, understand, manage, and use emotions effectively. Unlike traditional IQ, which measures cognitive abilities, EI focuses on emotional and social skills. Research has shown that individuals with high EI tend to perform better in leadership roles, have stronger interpersonal relationships, and experience greater overall well-being. In the workplace, EI has become a valuable asset, with many companies now incorporating EI training into their professional development programs.\nQ: Who first introduced the concept of emotional intelligence?', options: ['Daniel Goleman', 'Peter Salovey and John Mayer', 'Howard Gardner', 'Sigmund Freud'], answer: [1], analysis: '文章第一句明确指出是Peter Salovey和John Mayer于1990年首次提出，因此选B。Daniel Goleman是推广者而非首创者。', score: 7.1 },
    { id: 22, type: 'reading', level: 'cet4', section: '长篇阅读', question: 'Passage: Urban farming, the practice of cultivating food in cities, has gained significant popularity in recent years. Rooftop gardens, vertical farms, and community allotments are transforming urban landscapes. Proponents argue that urban farming reduces food miles, improves food security, and creates green spaces that benefit mental health. However, critics point out that urban agriculture faces challenges such as soil contamination, limited space, and high startup costs. Despite these obstacles, many cities worldwide are investing in urban farming initiatives as part of their sustainability strategies.\nQ: What is a challenge mentioned regarding urban farming?', options: ['Lack of consumer interest', 'Soil contamination', 'Excessive government regulation', 'Shortage of farmers'], answer: [1], analysis: '文章提到挑战包括"soil contamination, limited space, and high startup costs"（土壤污染、空间有限、启动成本高），因此选B。', score: 7.1 },
    { id: 23, type: 'reading', level: 'cet4', section: '长篇阅读', question: 'Passage: The digital nomad lifestyle, enabled by remote work technology, allows professionals to work from anywhere in the world. Popular destinations include Bali, Chiang Mai, and Lisbon, where the cost of living is relatively low and internet connectivity is reliable. Digital nomads often cite improved work-life balance and cultural enrichment as key benefits. However, this lifestyle also presents challenges such as visa restrictions, unstable income, and the lack of a permanent social network. Some countries have responded by introducing special digital nomad visas to attract these mobile workers.\nQ: Why have some countries introduced special visas?', options: ['To increase tourism revenue', 'To attract digital nomads', 'To regulate immigration', 'To promote local employment'], answer: [1], analysis: '文章最后一句说"Some countries have responded by introducing special digital nomad visas to attract these mobile workers"（一些国家推出特殊签证以吸引数字游民），因此选B。', score: 7.1 },
    { id: 24, type: 'reading', level: 'cet4', section: '长篇阅读', question: 'Passage: The placebo effect is a fascinating phenomenon in medical science. When patients receive a treatment with no therapeutic value, such as a sugar pill, they often experience real improvements in their condition simply because they believe they are receiving effective treatment. This psychological response can be so powerful that placebos are used as controls in clinical trials to test new drugs. Recent research suggests that the placebo effect involves complex interactions between the brain, expectation, and the body\'s natural healing mechanisms.\nQ: What is the placebo effect?', options: ['A side effect of medication', 'Improvement due to belief in treatment', 'A type of clinical trial', 'A new drug therapy'], answer: [1], analysis: '文章定义安慰剂效应为"patients often experience real improvements simply because they believe they are receiving effective treatment"（患者因相信治疗有效而出现真实改善），因此选B。', score: 7.1 },
    { id: 25, type: 'reading', level: 'cet4', section: '长篇阅读', question: 'Passage: Minimalism, as a lifestyle choice, advocates for living with fewer possessions and focusing on what truly matters. Followers of minimalism often declutter their homes, reduce consumption, and prioritize experiences over material goods. This movement has gained traction in response to consumer culture and environmental concerns. Minimalists argue that owning less leads to greater freedom, reduced stress, and increased financial savings. Critics, however, suggest that minimalism can be a privilege not accessible to those with limited resources.\nQ: What do minimalists prioritize?', options: ['Material wealth', 'Consumer goods', 'Experiences over possessions', 'Social status'], answer: [2], analysis: '文章说"prioritize experiences over material goods"（优先考虑体验而非物质商品），因此选C。', score: 7.1 },
    { id: 26, type: 'reading', level: 'cet4', section: '仔细阅读', question: 'Passage: The Internet of Things (IoT) refers to the network of physical devices embedded with sensors, software, and connectivity that enables them to exchange data. Smart homes, wearable fitness trackers, and connected cars are all examples of IoT applications. While IoT offers unprecedented convenience and efficiency, it also raises significant privacy and security concerns. Hackers can potentially access personal data through vulnerable devices, and the sheer volume of data collected raises questions about surveillance and data ownership. As IoT continues to expand, addressing these security challenges will be crucial for widespread adoption.\nQ: What is a major concern associated with IoT?', options: ['High cost of devices', 'Privacy and security risks', 'Lack of standardization', 'Limited battery life'], answer: [1], analysis: '文章提到"raises significant privacy and security concerns"（引发重大隐私和安全担忧），因此选B。', score: 14.2 },
    { id: 27, type: 'reading', level: 'cet4', section: '仔细阅读', question: 'Passage: The gig economy, characterized by short-term contracts and freelance work, has reshaped traditional employment relationships. Platforms like Uber, TaskRabbit, and Upwork connect workers with clients on a per-job basis. Supporters praise the flexibility and autonomy that gig work offers, allowing individuals to set their own schedules and pursue multiple income streams. Critics, however, argue that gig workers lack job security, benefits, and labor protections afforded to traditional employees. The debate over whether gig workers should be classified as employees or independent contractors continues in courts and legislatures worldwide.\nQ: What is a criticism of the gig economy?', options: ['It limits income potential', 'It reduces work flexibility', 'Workers lack security and benefits', 'It requires too much training'], answer: [2], analysis: '文章批评点在于"gig workers lack job security, benefits, and labor protections"（零工工作者缺乏工作保障、福利和劳动保护），因此选C。', score: 14.2 },
    { id: 28, type: 'reading', level: 'cet4', section: '仔细阅读', question: 'Passage: Mindfulness meditation, rooted in ancient Buddhist practices, has gained mainstream acceptance in Western psychology and medicine. The practice involves paying deliberate attention to the present moment without judgment. Clinical studies have demonstrated that mindfulness can reduce stress, anxiety, and depression while improving attention and emotional regulation. Major corporations now offer mindfulness programs to employees, and schools are incorporating mindfulness into their curricula. Despite its popularity, some researchers caution that more rigorous studies are needed to fully understand its long-term effects and mechanisms.\nQ: What do some researchers suggest about mindfulness?', options: ['It should be banned in schools', 'More rigorous research is needed', 'It has no real benefits', 'It is only suitable for adults'], answer: [1], analysis: '文章最后提到"some researchers caution that more rigorous studies are needed"（一些研究者警告需要更严谨的研究），因此选B。', score: 14.2 },
    { id: 29, type: 'reading', level: 'cet4', section: '仔细阅读', question: 'Passage: The circular economy is an economic model designed to eliminate waste and promote the continual use of resources. Unlike the traditional linear economy (take-make-dispose), the circular model emphasizes reuse, repair, refurbishment, and recycling. Products are designed for durability and eventual disassembly, allowing materials to be recovered and regenerated. This approach not only reduces environmental impact but also creates new business opportunities and jobs. Major companies like Philips and Renault have adopted circular principles, and the European Union has made the circular economy a key policy objective.\nQ: What is a key principle of the circular economy?', options: ['Maximizing consumption', 'Eliminating waste through reuse and recycling', 'Increasing production speed', 'Reducing product quality'], answer: [1], analysis: '文章定义循环经济为"designed to eliminate waste and promote the continual use of resources"（旨在消除浪费并促进资源持续利用），强调reuse, repair, recycling，因此选B。', score: 14.2 },
    { id: 30, type: 'reading', level: 'cet4', section: '仔细阅读', question: 'Passage: Genetic engineering, particularly CRISPR-Cas9 technology, has revolutionized biological research and medicine. This tool allows scientists to edit DNA with unprecedented precision, potentially curing genetic diseases and improving crop yields. However, the technology also raises ethical questions, particularly regarding human embryo editing and the potential for "designer babies." The scientific community remains divided on where to draw the line between therapeutic applications and enhancement. International guidelines and regulations are still evolving to keep pace with the rapid advancement of gene-editing capabilities.\nQ: What is a major ethical concern about CRISPR technology?', options: ['Its high cost', 'Human embryo editing and designer babies', 'Its inefficiency', 'Lack of public awareness'], answer: [1], analysis: '文章提到伦理问题涉及"human embryo editing and the potential for designer babies"（人类胚胎编辑和设计婴儿），因此选B。', score: 14.2 },
    { id: 31, type: 'reading', level: 'cet4', section: '仔细阅读', question: 'Passage: The sharing economy, exemplified by companies like Airbnb and Uber, allows individuals to monetize their assets, whether spare rooms or vehicles. This model has disrupted traditional industries and created new economic opportunities. Supporters argue that it promotes efficient resource utilization and provides flexible income options. However, traditional businesses complain about unfair competition, as sharing economy platforms often operate with fewer regulatory obligations. Cities around the world are grappling with how to regulate these new business models while balancing innovation and consumer protection.\nQ: What do traditional businesses complain about regarding the sharing economy?', options: ['Poor service quality', 'Unfair competition due to fewer regulations', 'High prices', 'Lack of innovation'], answer: [1], analysis: '文章说传统企业抱怨"unfair competition, as sharing economy platforms often operate with fewer regulatory obligations"（不公平竞争，因为共享经济平台监管义务更少），因此选B。', score: 14.2 },
    { id: 32, type: 'reading', level: 'cet4', section: '仔细阅读', question: 'Passage: Artificial intelligence is increasingly being used in healthcare diagnostics. Machine learning algorithms can analyze medical images, such as X-rays and MRIs, with accuracy comparable to or exceeding that of human radiologists. AI systems can detect patterns that might be missed by the human eye and can process vast amounts of data quickly. However, challenges remain, including the need for large, high-quality datasets, concerns about algorithmic bias, and questions about liability when AI makes errors. Many experts believe AI will augment rather than replace human doctors, handling routine tasks and allowing physicians to focus on complex cases.\nQ: What do many experts believe about AI in healthcare?', options: ['It will completely replace human doctors', 'It will augment human doctors by handling routine tasks', 'It is too unreliable for medical use', 'It should be restricted to research only'], answer: [1], analysis: '文章最后说"AI will augment rather than replace human doctors, handling routine tasks"（AI将增强而非取代人类医生，处理常规任务），因此选B。', score: 14.2 },
    { id: 33, type: 'reading', level: 'cet4', section: '仔细阅读', question: 'Passage: Sustainable fashion has emerged as a response to the environmental and social costs of the fast fashion industry. Fast fashion, characterized by rapid production of cheap clothing to match current trends, contributes to massive textile waste and poor labor conditions. Sustainable fashion brands prioritize eco-friendly materials, ethical manufacturing, and durable design. Consumers are increasingly demanding transparency in supply chains and are willing to pay more for responsibly produced clothing. However, the higher costs of sustainable production remain a barrier to widespread adoption, and greenwashing—making misleading environmental claims—continues to be a problem in the industry.\nQ: What is "greenwashing" in the fashion industry?', options: ['Using green dyes in clothing', 'Making misleading environmental claims', 'Recycling old clothes', 'Producing only green-colored garments'], answer: [1], analysis: '文章定义greenwashing为"making misleading environmental claims"（做出误导性的环保声明），因此选B。', score: 14.2 },
    { id: 34, type: 'reading', level: 'cet4', section: '仔细阅读', question: 'Passage: The attention economy refers to the marketplace where human attention is treated as a scarce commodity. Digital platforms, particularly social media, compete for users\' attention through algorithms designed to maximize engagement. Critics argue that this model incentivizes sensational content, misinformation, and addictive design patterns. The constant barrage of notifications and infinite scrolling features are engineered to keep users hooked. Some technology ethicists advocate for "humane design" that respects users\' time and attention rather than exploiting psychological vulnerabilities for profit.\nQ: What is a criticism of the attention economy?', options: ['It makes content boring', 'It incentivizes sensational content and addictive design', 'It reduces platform profits', 'It limits user choice'], answer: [1], analysis: '文章批评注意力经济"incentivizes sensational content, misinformation, and addictive design patterns"（激励耸人听闻的内容、错误信息和成瘾设计），因此选B。', score: 14.2 },
    { id: 35, type: 'reading', level: 'cet4', section: '仔细阅读', question: 'Passage: Space debris, or "space junk," consists of defunct satellites, spent rocket stages, and fragments from collisions orbiting Earth. With the increasing commercialization of space, the problem of orbital debris has become critical. Collisions with even small pieces of debris can damage or destroy active satellites due to their extremely high velocities. Various solutions have been proposed, including nets, harpoons, and lasers to remove debris, as well as designing satellites that burn up completely upon re-entry. International cooperation is essential to establish guidelines for responsible space operations and debris mitigation.\nQ: Why is space debris dangerous?', options: ['It blocks sunlight from reaching Earth', 'Collisions can destroy active satellites', 'It interferes with radio signals', 'It causes climate change'], answer: [1], analysis: '文章说"Collisions with even small pieces of debris can damage or destroy active satellites"（即使小碎片碰撞也能损坏或摧毁在轨卫星），因此选B。', score: 14.2 },

    // 翻译部分 (5题)
    { id: 36, type: 'translation', level: 'cet4', section: '汉译英', question: '中国将坚持创新、协调、绿色、开放、共享的新发展理念，推动经济高质量发展。\n参考译文: China will adhere to the new development philosophy of innovation, coordination, green development, openness and sharing, and promote high-quality economic development.\nQ: "新发展理念" 的正确英文表达是？', options: ['new development concept', 'new development philosophy', 'new development idea', 'new development theory'], answer: [1], analysis: '"新发展理念"标准译法为"new development philosophy"，其中philosophy比concept/idea/theory更能体现指导思想和战略层面的含义，是官方文件常用译法。', score: 15 },
    { id: 37, type: 'translation', level: 'cet4', section: '汉译英', question: '随着科技的进步，人工智能正在改变我们的生活方式，从智能家居到自动驾驶，无处不在。\n参考译文: With the advancement of technology, artificial intelligence is transforming our way of life, from smart homes to autonomous driving, everywhere.\nQ: "自动驾驶" 的正确英文表达是？', options: ['self-driving cars', 'automatic driving', 'autonomous driving', 'auto-pilot driving'], answer: [2], analysis: '"自动驾驶"标准术语为"autonomous driving"或"self-driving"，在正式语境中autonomous driving更专业。automatic driving语义不准确，auto-pilot通常指飞机自动驾驶仪。', score: 15 },
    { id: 38, type: 'translation', level: 'cet4', section: '汉译英', question: '中国传统文化强调和谐，认为人与自然应该和谐共生，这一理念对解决当今环境问题具有重要意义。\n参考译文: Traditional Chinese culture emphasizes harmony, believing that humans and nature should coexist harmoniously, a concept of great significance for addressing today\'s environmental issues.\nQ: "和谐共生" 的正确英文表达是？', options: ['harmonious coexistence', 'live together peacefully', 'coexist harmoniously', 'harmonious living'], answer: [2], analysis: '"和谐共生"可译为"coexist harmoniously"（副词修饰动词）或"harmonious coexistence"（名词短语）。根据句子结构"humans and nature should coexist harmoniously"，选C最符合语法结构。', score: 15 },
    { id: 39, type: 'translation', level: 'cet4', section: '汉译英', question: '中国政府高度重视教育事业，不断加大教育投入，努力让每个孩子都能享有公平而有质量的教育。\n参考译文: The Chinese government attaches great importance to education, continuously increasing investment in education, and striving to ensure that every child has access to fair and quality education.\nQ: "高度重视" 的正确英文表达是？', options: ['highly values', 'attaches great importance to', 'pays high attention to', 'focuses highly on'], answer: [1], analysis: '"高度重视"标准译法为"attaches great importance to"或"places high importance on"，是官方文件固定搭配。highly values语法正确但不够正式；pays high attention to和focuses highly on不符合英语表达习惯。', score: 15 },
    { id: 40, type: 'translation', level: 'cet4', section: '汉译英', question: '改革开放四十多年来，中国发生了翻天覆地的变化，人民生活水平显著提高。\n参考译文: Over the past four decades of reform and opening-up, China has undergone earth-shaking changes, and people\'s living standards have significantly improved.\nQ: "翻天覆地的变化" 的正确英文表达是？', options: ['tremendous changes', 'earth-shaking changes', 'great changes', 'remarkable changes'], answer: [1], analysis: '"翻天覆地"形象译为"earth-shaking"（震撼天地的）或"tremendous/remarkable"。earth-shaking最能传达原文的夸张修辞效果，是常见译法。', score: 15 },

    // 写作/词汇语法部分 (5题)
    { id: 41, type: 'reading', level: 'cet4', section: '词汇语法', question: '_______ the heavy rain, the outdoor concert was cancelled and all tickets were refunded.', options: ['Due to', 'Because', 'Since', 'As'], answer: [0], analysis: 'Due to是介词短语，后接名词the heavy rain。Because/Since/As是连词，后接从句，不能接名词短语。', score: 3.55 },
    { id: 42, type: 'reading', level: 'cet4', section: '词汇语法', question: 'The professor demanded that the paper _______ before the deadline without any exception.', options: ['be submitted', 'is submitted', 'was submitted', 'would be submitted'], answer: [0], analysis: 'demand后接虚拟语气，结构为"demand that + (should) + 动词原形"。should可以省略，因此用be submitted。', score: 3.55 },
    { id: 43, type: 'reading', level: 'cet4', section: '词汇语法', question: 'Not until midnight _______ the experiment, which turned out to be a complete success.', options: ['did they complete', 'they completed', 'had they completed', 'they had completed'], answer: [0], analysis: 'Not until置于句首时，主句要部分倒装。根据句意，实验完成发生在过去（turned out），用一般过去时did they complete。', score: 3.55 },
    { id: 44, type: 'reading', level: 'cet4', section: '词汇语法', question: 'The new policy is designed to address the issue of income inequality, _______ has been a major concern for decades.', options: ['which', 'that', 'what', 'it'], answer: [0], analysis: '非限制性定语从句，修饰前面整个句子，用which引导。that不能引导非限制性定语从句；what引导名词性从句；it不能引导从句。', score: 3.55 },
    { id: 45, type: 'reading', level: 'cet4', section: '词汇语法', question: '_______ is often the case with young entrepreneurs, he was full of passion but short of practical experience.', options: ['As', 'Which', 'It', 'What'], answer: [0], analysis: 'As is often the case是固定句型，意为"情况常常如此"。as引导非限制性定语从句，指代后面整个句子，在从句中作主语。', score: 3.55 },

    // ==================== 六级题库 ====================
    // 六级听力部分 (15题)
    { id: 101, type: 'listening', level: 'cet6', section: 'Section A', question: 'W: The dean announced that the seminar on climate change has been postponed until further notice due to the speaker\'s unexpected absence.\nM: That\'s a shame. I\'d already rearranged my schedule to attend it this Friday.\nQ: Why was the seminar postponed?', options: ['The speaker failed to show up', 'The dean rescheduled his Friday', 'The audience had scheduling conflicts', 'The venue was unavailable'], answer: [0], analysis: '女士明确说研讨会因"the speaker\'s unexpected absence"（演讲者临时缺席）而推迟，因此选A。B/C/D均未在对话中提及。', score: 7.1 },
    { id: 102, type: 'listening', level: 'cet6', section: 'Section A', question: 'M: I\'ve been shortlisted for the internship at the consulting firm, but the interview coincides with my thesis defense.\nW: Why don\'t you ask Professor Brown whether you can defend a week earlier? He\'s quite accommodating.\nQ: What does the woman suggest the man do?', options: ['Give up the internship opportunity', 'Postpone his thesis defense by a week', 'Request an earlier thesis defense', 'Ask the firm for an online interview'], answer: [2], analysis: '女士建议"ask Professor Brown whether you can defend a week earlier"（问教授能否提前一周答辩），即C选项。A/D未提及；B与建议相反。', score: 7.1 },
    { id: 103, type: 'listening', level: 'cet6', section: 'Section A', question: 'W: Our department\'s budget proposal was turned down again. Apparently, the board thinks the projected returns are too speculative.\nM: Well, at least we can proceed with the reduced version that covers only the core research.\nQ: What can be inferred from the conversation?', options: ['The board approved the full budget', 'The department will carry out a scaled-down plan', 'The core research has been cancelled', 'The woman will revise the projected returns'], answer: [1], analysis: '男士说"at least we can proceed with the reduced version"（至少可以按缩减版继续），推断系将执行缩减后的计划，选B。A与"turned down"矛盾；C与"covers only the core research"矛盾；D无依据。', score: 7.1 },
    { id: 104, type: 'listening', level: 'cet6', section: 'Section A', question: 'M: The museum is holding a special exhibition of ancient Chinese porcelain. Admission is free for students this month.\nW: Perfect timing. I\'ve been meaning to brush up on my knowledge of ceramics for my art history course.\nQ: What will the woman probably do?', options: ['Visit the museum exhibition', 'Skip the art history course', 'Buy porcelain at the museum', 'Lend her student ID to a friend'], answer: [0], analysis: '女士说"Perfect timing"并提到正想巩固陶瓷知识（for my art history course），推断她会去看展览，选A。其余选项均无依据。', score: 7.1 },
    { id: 105, type: 'listening', level: 'cet6', section: 'Section A', question: 'W: Mr. Smith, your report was thorough, but the conclusions seem to contradict the data presented in Chapter Three.\nM: You\'re right. I must have mixed up the figures from the two surveys. I\'ll revise it before Friday.\nQ: What will Mr. Smith do?', options: ['Resubmit the data in Chapter Three', 'Conduct two additional surveys', 'Correct the inconsistent figures', 'Extend the Friday deadline'], answer: [2], analysis: '男士承认"mixed up the figures"（弄混了两份调查的数据），并表示"revise it before Friday"，即修正不一致的数据，选C。A/B/D均未提及。', score: 7.1 },
    { id: 106, type: 'listening', level: 'cet6', section: 'Section B', question: 'M: Dr. Collins, I\'m considering dropping your advanced statistics course. I\'m afraid I can\'t keep up with the workload.\nW: Before you make the final decision, why not try the peer tutoring program? Many students who struggled at first found it quite helpful.\nM: Does it cost extra?\nW: Not at all. It\'s funded by the department. Sessions are held every Tuesday and Thursday evening.\nQ1: Why does the man want to drop the statistics course?', options: ['He can\'t cope with the workload', 'He finds the lectures boring', 'He failed the midterm exam', 'He wants to take another course'], answer: [0], analysis: '男士说"I can\'t keep up with the workload"（跟不上课程负担），即A。B/C/D对话均未提及。', score: 7.1 },
    { id: 107, type: 'listening', level: 'cet6', section: 'Section B', question: 'M: Dr. Collins, I\'m considering dropping your advanced statistics course. I\'m afraid I can\'t keep up with the workload.\nW: Before you make the final decision, why not try the peer tutoring program? Many students who struggled at first found it quite helpful.\nM: Does it cost extra?\nW: Not at all. It\'s funded by the department. Sessions are held every Tuesday and Thursday evening.\nQ2: What does the woman suggest the man do?', options: ['Switch to a basic course', 'Join the peer tutoring program', 'Apply for a deadline extension', 'Form a study group'], answer: [1], analysis: '女士建议"why not try the peer tutoring program"（为何不试试同伴辅导项目），选B。', score: 7.1 },
    { id: 108, type: 'listening', level: 'cet6', section: 'Section B', question: 'M: Dr. Collins, I\'m considering dropping your advanced statistics course. I\'m afraid I can\'t keep up with the workload.\nW: Before you make the final decision, why not try the peer tutoring program? Many students who struggled at first found it quite helpful.\nM: Does it cost extra?\nW: Not at all. It\'s funded by the department. Sessions are held every Tuesday and Thursday evening.\nQ3: What does the woman say about the tutoring program?', options: ['It charges a small fee', 'It meets once a week', 'It is funded by the department', 'It is taught by Professor Collins'], answer: [2], analysis: '女士明确说"It\'s funded by the department"（由系里资助），免费且每周两次（周二、周四），因此选C；A与"cost extra? Not at all"矛盾；B与两次/周不符；D未提及。', score: 7.1 },
    { id: 109, type: 'listening', level: 'cet6', section: 'Section B', question: 'W: Good afternoon. I\'m calling about the apartment advertised on the university housing board. Is it still available?\nM: Yes, but I should mention it\'s on the fifth floor without an elevator. That\'s why the rent is lower than similar flats nearby.\nW: That\'s fine for me. Could I come to view it tomorrow morning?\nM: Sure. How about ten o\'clock? Please bring your student ID for the rental contract.\nQ1: Why is the apartment cheaper than similar ones?', options: ['It is far from the university', 'It has no elevator', 'It is poorly furnished', 'The landlord is inexperienced'], answer: [1], analysis: '男士解释"it\'s on the fifth floor without an elevator. That\'s why the rent is lower"（没有电梯所以租金更低），选B。', score: 7.1 },
    { id: 110, type: 'listening', level: 'cet6', section: 'Section B', question: 'W: Good afternoon. I\'m calling about the apartment advertised on the university housing board. Is it still available?\nM: Yes, but I should mention it\'s on the fifth floor without an elevator. That\'s why the rent is lower than similar flats nearby.\nW: That\'s fine for me. Could I come to view it tomorrow morning?\nM: Sure. How about ten o\'clock? Please bring your student ID for the rental contract.\nQ2: What is the woman asked to bring tomorrow?', options: ['The rental deposit', 'Her housing application', 'A friend as a witness', 'Her student ID'], answer: [3], analysis: '男士明确要求"Please bring your student ID for the rental contract"（签租房合同请带学生证），选D。', score: 7.1 },
    { id: 111, type: 'listening', level: 'cet6', section: 'Section C', question: 'Passage: Remote work has fundamentally altered the way companies operate. A recent survey of over five thousand employees revealed that while productivity remained stable, employees reported a stronger sense of isolation. To address this, many firms now organize regular in-person retreats, where team members gather to brainstorm and strengthen interpersonal bonds. Experts note that the key to successful remote collaboration lies not in the technology itself, but in deliberate efforts to maintain trust and communication.\nQ: What do experts consider the key to successful remote collaboration?', options: ['Advanced communication technology', 'Frequent online meetings', 'Deliberate efforts to maintain trust', 'Larger team sizes'], answer: [2], analysis: '短文结尾明确指出"the key...lies not in the technology itself, but in deliberate efforts to maintain trust and communication"（关键不在于技术，而在于刻意维护信任与沟通），选C。', score: 7.1 },
    { id: 112, type: 'listening', level: 'cet6', section: 'Section C', question: 'Passage: The popularity of electric vehicles has grown dramatically over the past decade. However, the shortage of charging infrastructure remains a major obstacle, particularly in rural areas. Governments have responded by offering subsidies to businesses that install charging stations. Analysts predict that once the infrastructure gap is closed, electric vehicles will account for more than half of new car sales worldwide.\nQ: What remains a major obstacle to the spread of electric vehicles?', options: ['High battery costs', 'Insufficient charging infrastructure', 'Government restrictions', 'Public distrust of new technology'], answer: [1], analysis: '短文明确说"the shortage of charging infrastructure remains a major obstacle"（充电设施不足仍是主要障碍），选B。A/C/D未提及。', score: 7.1 },
    { id: 113, type: 'listening', level: 'cet6', section: 'Section C', question: 'Passage: A growing body of research suggests that sleep deprivation impairs not only memory but also moral judgment. In one experiment, participants who slept fewer than five hours were significantly more likely to make unethical decisions under pressure. Researchers therefore advise companies to reconsider schedules that require employees to work overnight, arguing that the economic gains are outweighed by the long-term costs.\nQ: What did the experiment find about participants who slept fewer than five hours?', options: ['They performed better under pressure', 'They were more prone to unethical decisions', 'They showed improved memory', 'They requested more overnight shifts'], answer: [1], analysis: '实验发现睡眠少于5小时的参与者"significantly more likely to make unethical decisions under pressure"（在压力下更易做出不道德决定），选B。A与原文相反；C/D未提及。', score: 7.1 },
    { id: 114, type: 'listening', level: 'cet6', section: 'Section C', question: 'Passage: Urban gardening has gained momentum in many crowded cities. Rooftops and balconies are being converted into vegetable patches, providing residents with fresh produce and a rare connection with nature. Studies indicate that community gardens also foster social cohesion, as neighbors who garden together are more likely to look out for one another. City planners are now incorporating green spaces into new residential projects as a standard feature.\nQ: What benefit of community gardens is mentioned besides providing fresh produce?', options: ['Lowering housing prices', 'Reducing traffic congestion', 'Fostering social cohesion', 'Attracting more tourists'], answer: [2], analysis: '短文说"community gardens also foster social cohesion"（促进社会凝聚力），即除了提供新鲜农产品外的另一好处，选C。其余选项未提及。', score: 7.1 },
    { id: 115, type: 'listening', level: 'cet6', section: 'Section C', question: 'Passage: The university\'s new career development center offers mock interviews, resume workshops, and one-on-one counseling. According to its director, students who attended at least three sessions last year received job offers nearly a month earlier than those who did not. The center plans to expand its services to graduate students next semester and to invite alumni to share industry insights.\nQ: What do we learn about students who attended at least three sessions?', options: ['They received job offers earlier', 'They all chose to pursue graduate study', 'They earned higher starting salaries', 'They preferred one-on-one counseling'], answer: [0], analysis: '短文说参加至少3次活动的学生"received job offers nearly a month earlier"（提前近一个月拿到录用），选A。B/C/D未提及。', score: 7.1 },

    // 六级阅读部分 (20题)
    { id: 116, type: 'reading', level: 'cet6', section: '选词填空', question: 'The journalist\'s report offered an unprecedented glimpse into the _______ world of international arms dealing.', options: ['celebrated', 'compulsory', 'contemporary', 'clandestine'], answer: [3], analysis: 'clandestine意为"秘密的"，clandestine world of arms dealing（军火交易的隐秘世界）符合语境。celebrated（著名的）、compulsory（强制的）、contemporary（当代的）均不搭配。', score: 3.55 },
    { id: 117, type: 'reading', level: 'cet6', section: '选词填空', question: 'Economists warn that the gap between the rich and the poor will continue to _______ unless effective redistribution policies are enforced.', options: ['distribute', 'designate', 'dominate', 'deteriorate'], answer: [3], analysis: 'deteriorate意为"恶化"，贫富差距持续恶化符合语境。distribute（分配）、designate（指定）、dominate（支配）语义不通。', score: 3.55 },
    { id: 118, type: 'reading', level: 'cet6', section: '选词填空', question: 'The committee reached a(n) _______ decision, with every member supporting the reform proposal.', options: ['ambiguous', 'anonymous', 'autonomous', 'unanimous'], answer: [3], analysis: 'unanimous意为"一致同意的"，与后半句"every member supporting"（全体成员支持）呼应。ambiguous（模糊的）、anonymous（匿名的）、autonomous（自治的）均不合语境。', score: 3.55 },
    { id: 119, type: 'reading', level: 'cet6', section: '选词填空', question: 'Scientists have yet to find a satisfactory explanation for the _______ disappearance of the ancient civilization.', options: ['mysterious', 'meticulous', 'mutual', 'moderate'], answer: [0], analysis: 'mysterious disappearance意为"神秘的消失"，古代文明突然消失无从解释，符合语境。meticulous（一丝不苟的）、mutual（相互的）、moderate（温和的）均不修饰disappearance。', score: 3.55 },
    { id: 120, type: 'reading', level: 'cet6', section: '选词填空', question: 'The professor encouraged students to _______ conventional wisdom and explore alternative approaches to the problem.', options: ['adhere to', 'comply with', 'question', 'endorse'], answer: [2], analysis: 'question此处作动词意为"质疑"，与后半句"explore alternative approaches"（探索其他方法）逻辑呼应。adhere to/comply with（遵守）、endorse（赞同）均与探索新方法矛盾。', score: 3.55 },
    { id: 121, type: 'reading', level: 'cet6', section: '仔细阅读', question: 'Despite the initial setbacks, the startup eventually secured substantial investment, thanks to its _______ business model.', options: ['robust', 'redundant', 'reluctant', 'ridiculous'], answer: [0], analysis: 'robust意为"稳健的、有活力的"，robust business model（稳健的商业模式）是吸引投资的合理原因。redundant（冗余的）、reluctant（不情愿的）、ridiculous（荒谬的）均不合逻辑。', score: 3.55 },
    { id: 122, type: 'reading', level: 'cet6', section: '仔细阅读', question: 'The government has launched a campaign to _______ public awareness of cybersecurity threats among senior citizens.', options: ['alleviate', 'diminish', 'heighten', 'undermine'], answer: [2], analysis: 'heighten awareness意为"提高意识"，发起宣传活动目的应是提高老年人的网络安全意识。alleviate/diminish（减轻/减少）、undermine（削弱）均与campaign的目的相悖。', score: 3.55 },
    { id: 123, type: 'reading', level: 'cet6', section: '仔细阅读', question: 'The witness\'s account was so _______ that the police had to dismiss it as unreliable.', options: ['coherent', 'concise', 'contradictory', 'consistent'], answer: [2], analysis: 'contradictory意为"自相矛盾的"，正因为证词前后矛盾才会被认定不可靠（unreliable）。coherent（连贯的）、concise（简洁的）、consistent（一致的）都不会导致不可靠。', score: 3.55 },
    { id: 124, type: 'reading', level: 'cet6', section: '仔细阅读', question: 'Many species are on the verge of extinction because their natural habitats are being _______ at an alarming rate.', options: ['destroyed', 'preserved', 'restored', 'expanded'], answer: [0], analysis: '物种濒临灭绝的原因是栖息地被快速破坏（destroyed），因果关系成立。preserved（保护）、restored（恢复）、expanded（扩张）均不会导致灭绝。', score: 3.55 },
    { id: 125, type: 'reading', level: 'cet6', section: '仔细阅读', question: 'The CEO\'s resignation speech was deliberately _______, leaving journalists with more questions than answers.', options: ['vague', 'explicit', 'verbose', 'candid'], answer: [0], analysis: 'vague意为"含糊其辞的"，deliberately vague（故意含糊）才会让记者疑问多于答案。explicit（明确的）、verbose（冗长的）、candid（坦率的）均不能产生该结果。', score: 3.55 },
    { id: 126, type: 'reading', level: 'cet6', section: '仔细阅读', question: 'Passage: A team of researchers at Oxford University has developed an AI system capable of detecting early signs of heart failure from routine blood tests. Traditional diagnosis often relies on symptoms that appear only in advanced stages, which delays treatment. The new system analyzes subtle patterns in blood biomarkers, achieving an accuracy rate of 87 percent in clinical trials. The researchers emphasize that the tool is intended to assist, rather than replace, physicians in making diagnoses.\nQ1: What advantage does the new AI system have over traditional diagnosis?', options: ['It costs much less than blood tests', 'It detects the disease at an earlier stage', 'It eliminates the need for physicians', 'It has an accuracy rate of 100 percent'], answer: [1], analysis: '文中指出传统诊断依赖晚期才出现的症状从而延误治疗，而新系统能检测"early signs"（早期迹象），优势在于更早发现，选B。C与"assist, rather than replace"矛盾；D与87%不符。', score: 3.55 },
    { id: 127, type: 'reading', level: 'cet6', section: '仔细阅读', question: 'Passage: A team of researchers at Oxford University has developed an AI system capable of detecting early signs of heart failure from routine blood tests. Traditional diagnosis often relies on symptoms that appear only in advanced stages, which delays treatment. The new system analyzes subtle patterns in blood biomarkers, achieving an accuracy rate of 87 percent in clinical trials. The researchers emphasize that the tool is intended to assist, rather than replace, physicians in making diagnoses.\nQ2: According to the researchers, the AI system is designed to _______.', options: ['replace physicians in hospitals', 'diagnose all types of heart disease', 'assist doctors in diagnosis', 'treat patients remotely'], answer: [2], analysis: '结尾明确说"intended to assist, rather than replace, physicians"（旨在辅助而非取代医生），选C。', score: 3.55 },
    { id: 128, type: 'reading', level: 'cet6', section: '仔细阅读', question: 'Passage: The sharing economy, once hailed as a revolutionary force, is now facing mounting criticism. Critics argue that platforms in this sector often evade labor regulations, leaving workers without basic protections such as insurance and paid leave. Proponents, however, maintain that the sharing economy offers flexibility that conventional employment cannot match, and that most participants engage in it voluntarily to supplement their income.\nQ1: What is the main criticism of the sharing economy mentioned in the passage?', options: ['It charges users excessively high fees', 'It avoids labor regulations, leaving workers unprotected', 'It provides no flexibility for workers', 'It destroys conventional industries entirely'], answer: [1], analysis: '批评者指出平台"evade labor regulations, leaving workers without basic protections"（规避劳动法规，使从业者缺乏基本保障），选B。', score: 3.55 },
    { id: 129, type: 'reading', level: 'cet6', section: '仔细阅读', question: 'Passage: The sharing economy, once hailed as a revolutionary force, is now facing mounting criticism. Critics argue that platforms in this sector often evade labor regulations, leaving workers without basic protections such as insurance and paid leave. Proponents, however, maintain that the sharing economy offers flexibility that conventional employment cannot match, and that most participants engage in it voluntarily to supplement their income.\nQ2: What do proponents of the sharing economy argue?', options: ['It should replace conventional employment', 'Its workers deserve equal insurance coverage', 'It offers flexibility unmatched by conventional jobs', 'It should be regulated as a traditional industry'], answer: [2], analysis: '支持者认为"offers flexibility that conventional employment cannot match"（提供传统就业无法比拟的灵活性），选C。', score: 3.55 },
    { id: 130, type: 'reading', level: 'cet6', section: '仔细阅读', question: 'Passage: A recent study tracking two thousand adolescents over five years found a correlation between heavy social media use and increased rates of anxiety. However, the researchers caution that correlation does not imply causation: it remains unclear whether social media causes anxiety or whether anxious adolescents are simply more drawn to online interaction. They call for longitudinal experiments to establish the underlying mechanism.\nQ: What caution do the researchers express about the study\'s findings?', options: ['The sample size was too small to be meaningful', 'Correlation does not prove causation', 'The five-year period was too short', 'Anxiety rates were exaggerated by the media'], answer: [1], analysis: '研究者明确提醒"correlation does not imply causation"（相关性不等于因果性），无法确定谁是原因，选B。', score: 3.55 },
    { id: 131, type: 'reading', level: 'cet6', section: '仔细阅读', question: 'Passage: Gene editing technology holds enormous promise for eliminating hereditary diseases, yet it also raises profound ethical questions. Critics contend that tampering with the human genome could produce unforeseen consequences for future generations, while supporters argue that a cautious, well-regulated application could spare millions from suffering. International guidelines currently prohibit clinical applications that would result in heritable modifications.\nQ1: What is the international community\'s current stance on gene editing?', options: ['It encourages clinical trials on embryos', 'It bans heritable clinical applications', 'It has issued no guidelines at all', 'It fully supports commercial use'], answer: [1], analysis: '结尾说"International guidelines currently prohibit clinical applications that would result in heritable modifications"（国际准则禁止会导致可遗传改变的临床应用），选B。', score: 3.55 },
    { id: 132, type: 'reading', level: 'cet6', section: '仔细阅读', question: 'Passage: Gene editing technology holds enormous promise for eliminating hereditary diseases, yet it also raises profound ethical questions. Critics contend that tampering with the human genome could produce unforeseen consequences for future generations, while supporters argue that a cautious, well-regulated application could spare millions from suffering. International guidelines currently prohibit clinical applications that would result in heritable modifications.\nQ2: What do critics of gene editing worry about?', options: ['The high cost of medical treatment', 'The slow progress of the technology', 'Unforeseen consequences for future generations', 'The shortage of qualified researchers'], answer: [2], analysis: '批评者担忧"tampering with the human genome could produce unforeseen consequences for future generations"（篡改人类基因组可能给后代带来不可预见的后果），选C。', score: 3.55 },
    { id: 133, type: 'reading', level: 'cet6', section: '仔细阅读', question: 'Passage: The decline of local newspapers has created what scholars call "news deserts" — communities where residents no longer have access to reliable local reporting. Studies show that in towns without a local paper, voter turnout decreases and government corruption goes unnoticed. Some nonprofit organizations are experimenting with community-funded journalism, though sustaining such ventures financially remains a formidable challenge.\nQ1: What problem do "news deserts" lead to according to the passage?', options: ['Higher costs of running governments', 'Lower voter turnout and unnoticed corruption', 'The rise of nonprofit journalism', 'Increased competition among media outlets'], answer: [1], analysis: '文中指出在没有地方报纸的城镇"voter turnout decreases and government corruption goes unnoticed"（投票率下降、政府腐败无人察觉），选B。', score: 3.55 },
    { id: 134, type: 'reading', level: 'cet6', section: '仔细阅读', question: 'Passage: The decline of local newspapers has created what scholars call "news deserts" — communities where residents no longer have access to reliable local reporting. Studies show that in towns without a local paper, voter turnout decreases and government corruption goes unnoticed. Some nonprofit organizations are experimenting with community-funded journalism, though sustaining such ventures financially remains a formidable challenge.\nQ2: What challenge does community-funded journalism face?', options: ['Attracting enough readers', 'Competition from local papers', 'Government censorship', 'Financial sustainability'], answer: [3], analysis: '结尾说"sustaining such ventures financially remains a formidable challenge"（在财务上维持此类项目仍是巨大挑战），选D。', score: 3.55 },
    { id: 135, type: 'reading', level: 'cet6', section: '仔细阅读', question: 'Passage: Psychologists have long debated whether intelligence is fixed or malleable. Recent studies support the latter view, demonstrating that students who are taught that abilities can be developed through effort tend to embrace challenges and persist after failures. Educators are now incorporating this "growth mindset" into curricula, though some scholars warn that the effect sizes reported in early studies may have been overstated.\nQ: What do recent studies suggest about intelligence?', options: ['It is fixed at birth', 'It can be developed through effort', 'It cannot be measured reliably', 'It declines after adolescence'], answer: [1], analysis: '研究支持"malleable"（可塑的）观点，表明"abilities can be developed through effort"（能力可以通过努力发展），选B。', score: 3.55 },

    // 六级翻译部分 (5题)
    { id: 136, type: 'translation', level: 'cet6', section: '汉译英', question: '中国高铁网络不断扩展，运营里程位居世界前列，为区域经济发展注入了强劲动力。\n参考译文: China\'s high-speed rail network has been continuously expanding, with its operating mileage ranking among the top in the world, injecting strong momentum into regional economic development.\nQ: "注入强劲动力" 的正确英文表达是？', options: ['injecting strong momentum', 'pouring powerful power', 'injection of strong move', 'putting strong motion'], answer: [0], analysis: '"注入强劲动力"标准译法为"inject strong momentum"，momentum是"动力/势头"的地道表达。pour power、strong move、strong motion均属中式英语搭配错误。', score: 15 },
    { id: 137, type: 'translation', level: 'cet6', section: '汉译英', question: '数字经济已成为中国经济增长的重要引擎，移动支付、电子商务等新业态蓬勃发展。\n参考译文: The digital economy has become an important engine of China\'s economic growth, with new business forms such as mobile payment and e-commerce flourishing.\nQ: "蓬勃发展" 的正确英文表达是？', options: ['flourish and develop', 'flourishing', 'flushing', 'flourishingly developed'], answer: [1], analysis: '"蓬勃发展"译为"flourish/flourishing"，with复合结构中用现在分词flourishing表伴随状态。flushing（脸红/冲刷）是形近词干扰；flourish and develop语义重复。', score: 15 },
    { id: 138, type: 'translation', level: 'cet6', section: '汉译英', question: '中国政府大力推进生态文明建设，坚持走绿色低碳可持续发展道路。\n参考译文: The Chinese government vigorously promotes ecological progress, adhering to the path of green, low-carbon and sustainable development.\nQ: "可持续发展" 的正确英文表达是？', options: ['developable continuance', 'sustainable development', 'continued sustaining', 'durable development'], answer: [1], analysis: '"可持续发展"是固定术语"sustainable development"，sustainable指"可持续的"。developable、durable均为词形干扰，continued sustaining搭配错误。', score: 15 },
    { id: 139, type: 'translation', level: 'cet6', section: '汉译英', question: '京剧被誉为中国的国粹，是集唱、念、做、打于一体的表演艺术形式，有着两百多年的历史。\n参考译文: Peking Opera, hailed as the quintessence of Chinese culture, is a performing art integrating singing, recitation, acting and martial arts, with a history of more than two hundred years.\nQ: "国粹" 的正确英文表达是？', options: ['national essence', 'country heart', 'state essence', 'nation core'], answer: [0], analysis: '"国粹"标准译法为"national essence"或"quintessence of Chinese culture"。country/state/nation均指"国家"而非"民族/国民文化"，heart/core无"精华"之义。', score: 15 },
    { id: 140, type: 'translation', level: 'cet6', section: '汉译英', question: '随着人口老龄化加剧，中国政府不断完善养老服务体系，努力满足老年人多样化的养老需求。\n参考译文: As the population ages, the Chinese government keeps improving the elderly care service system, striving to meet the diversified needs of senior citizens.\nQ: "人口老龄化" 的正确英文表达是？', options: ['population becoming old', 'aging of the population', 'old-aged population', 'populace aging'], answer: [1], analysis: '"人口老龄化"标准表达为"aging of the population"或"population aging"。becoming old过于口语化；old-aged搭配不当；populace用词生僻且搭配不规范。', score: 15 },

    // 六级词汇语法部分 (5题)
    { id: 141, type: 'reading', level: 'cet6', section: '词汇语法', question: 'The scandal has severely damaged the company\'s reputation, and it will take years to _______ public trust.', options: ['retain', 'refrain', 'restrain', 'regain'], answer: [3], analysis: 'regain意为"重新获得"，丑闻损害声誉后需要"重新赢回"公众信任。retain（保留）、refrain（抑制，与from搭配）、restrain（约束）均不合语境。', score: 3.55 },
    { id: 142, type: 'reading', level: 'cet6', section: '词汇语法', question: 'The scientist\'s claim was met with skepticism until other laboratories could _______ her results.', options: ['replicate', 'duplicate', 'complicate', 'indicate'], answer: [0], analysis: 'replicate results意为"复现实验结果"，是科学验证的标准用语，其他实验室能复现结果才能消除质疑。duplicate（复制，多指文件或多余重复）、complicate（复杂化）、indicate（表明）均不合语境。', score: 3.55 },
    { id: 143, type: 'reading', level: 'cet6', section: '词汇语法', question: 'Hardly _______ the negotiation table when the two delegations began to argue over the agenda.', options: ['they had sat at', 'had they sat at', 'they sat at', 'did they sat at'], answer: [1], analysis: 'Hardly...when...句型中，Hardly置于句首时主句需部分倒装，且从句动作"坐下"发生在"开始争吵"之前，用过去完成时，故为"had they sat at"。D选项did后应接动词原形sat错误。', score: 3.55 },
    { id: 144, type: 'reading', level: 'cet6', section: '词汇语法', question: 'The minister\'s remarks were widely interpreted as a(n) _______ to the opposition\'s proposal, though he never explicitly endorsed it.', options: ['allusion', 'illusion', 'elusion', 'delusion'], answer: [0], analysis: 'allusion意为"暗指、影射"，部长从未明确支持却被广泛解读为暗指对方提案，符合语境。illusion（幻觉）、elusion（逃避）、delusion（错觉）均为形近词干扰。', score: 3.55 },
    { id: 145, type: 'reading', level: 'cet6', section: '词汇语法', question: 'The proposal was rejected on the grounds that its benefits were _______ outweighed by its potential risks.', options: ['fractionally', 'substantially', 'marginally', 'negligibly'], answer: [1], analysis: '提案被否决，说明风险"大幅"超过收益，substantially outweighed（大幅超过）逻辑成立。fractionally/marginally/negligibly均表示"微小地"，若风险只是略微超过收益，通常不会直接否决。', score: 3.55 },
];

// ==================== 应用状态 ====================
const app = {
    currentPage: 'dashboard',
    currentExam: null,
    currentQuestionIndex: 0,
    examAnswers: {},
    examMarked: {},
    examTimer: null,
    examTimeLeft: 0,
    examStartTime: null,
    practiceCategory: 'all',
    practiceIndex: 0,
    practiceAnswers: {},
    showAnalysis: false,
    wrongQuestions: [],
    examHistory: [],
    stats: { totalAnswered: 0, totalCorrect: 0 },
    currentLevel: 'cet4',

    init() {
        this.loadData();
        this.showPage('dashboard');
        window.addEventListener('beforeunload', () => {
            if (this.currentExam) this.saveExamProgress();
        });
        setInterval(() => this.saveExamProgress(), 5000);
    },

    loadData() {
        try {
            this.wrongQuestions = JSON.parse(localStorage.getItem('cet_wrong_questions') || '[]');
            this.examHistory = JSON.parse(localStorage.getItem('cet_exam_history') || '[]');
            this.stats = JSON.parse(localStorage.getItem('cet_stats') || '{"totalAnswered":0,"totalCorrect":0}');
            this.currentLevel = localStorage.getItem('cet_current_level') || 'cet4';
            const savedExam = localStorage.getItem('cet_exam_progress');
            if (savedExam) {
                const data = JSON.parse(savedExam);
                if (data && data.startTime && (Date.now() - data.startTime < 3 * 60 * 60 * 1000)) {
                    this.currentExam = data;
                    this.examAnswers = data.answers || {};
                    this.examMarked = data.marked || {};
                    this.examStartTime = data.startTime;
                    this.examTimeLeft = data.timeLeft || 7200;
                } else {
                    localStorage.removeItem('cet_exam_progress');
                }
            }
        } catch (e) { console.error('Load error:', e); }
    },

    saveData() {
        localStorage.setItem('cet_wrong_questions', JSON.stringify(this.wrongQuestions));
        localStorage.setItem('cet_exam_history', JSON.stringify(this.examHistory));
        localStorage.setItem('cet_stats', JSON.stringify(this.stats));
        localStorage.setItem('cet_current_level', this.currentLevel);
    },

    saveExamProgress() {
        if (this.currentExam) {
            localStorage.setItem('cet_exam_progress', JSON.stringify({
                answers: this.examAnswers,
                marked: this.examMarked,
                timeLeft: this.examTimeLeft,
                startTime: this.examStartTime,
                currentIndex: this.currentQuestionIndex
            }));
        }
    },

    showPage(page, params = {}) {
        this.currentPage = page;
        const nav = document.getElementById('navTimer');
        const main = document.getElementById('mainContent');
        
        if (page === 'exam') {
            nav.classList.remove('hidden');
            nav.classList.add('flex');
        } else {
            nav.classList.add('hidden');
            nav.classList.remove('flex');
        }

        switch(page) {
            case 'dashboard': this.renderDashboard(); break;
            case 'exam': this.renderExam(); break;
            case 'practice': this.renderPractice(params.category || 'all'); break;
            case 'wrongbook': this.renderWrongBook(); break;
            case 'history': this.renderHistory(); break;
            case 'result': this.renderResult(params.result); break;
        }
    },

    switchLevel(level) {
        if (this.currentLevel === level) return;
        this.currentLevel = level;
        this.saveData();
        this.showPage('dashboard');
        this.showToast(level === 'cet4' ? '已切换至四级' : '已切换至六级');
    },

    showToast(text) {
        const toast = document.getElementById('toast');
        document.getElementById('toastText').textContent = text;
        toast.classList.remove('hidden');
        setTimeout(() => toast.classList.add('hidden'), 2000);
    },

    showModal(html) {
        const modal = document.getElementById('modal');
        document.getElementById('modalContent').innerHTML = html;
        modal.classList.remove('hidden');
        modal.classList.add('flex');
    },

    closeModal() {
        const modal = document.getElementById('modal');
        modal.classList.add('hidden');
        modal.classList.remove('flex');
    },

    // ==================== 仪表盘 ====================
    renderDashboard() {
        const main = document.getElementById('mainContent');
        const levelHistory = this.examHistory.filter(h => h.level === this.currentLevel);
        const totalExams = levelHistory.length;
        const avgScore = totalExams > 0 ? Math.round(levelHistory.reduce((a,b) => a + b.totalScore, 0) / totalExams) : 0;
        const maxScore = totalExams > 0 ? Math.max(...levelHistory.map(h => h.totalScore)) : 0;
        const accuracy = this.stats.totalAnswered > 0 ? Math.round((this.stats.totalCorrect / this.stats.totalAnswered) * 100) : 0;
        const levelWrongCount = this.wrongQuestions.filter(w => w.level === this.currentLevel).length;

        main.innerHTML = `
            <div class="fade-in">
                <div class="mb-8">
                    <h1 class="text-2xl sm:text-3xl font-bold text-gray-900 mb-2">欢迎回来</h1>
